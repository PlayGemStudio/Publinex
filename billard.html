<script>
"use strict";

/* ==========================================================
   PUBLINEX 8 BALL
   Physique fixe à 120 Hz + rendu requestAnimationFrame
   ========================================================== */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const statusEl = document.getElementById("status");
const p1El = document.getElementById("player1");
const p2El = document.getElementById("player2");
const powerRange = document.getElementById("powerRange");
const powerFill = document.getElementById("powerFill");
const powerValue = document.getElementById("powerValue");
const soundButton = document.getElementById("soundButton");
const newGameButton = document.getElementById("newGame");

const W = 1600;
const H = 800;

const PLAY = {
  left:172,
  right:1428,
  top:122,
  bottom:678
};

const R = 18;
const POCKET_R = 38;

const FRICTION = 0.992;
const RESTITUTION = 0.965;
const CUSHION_RESTITUTION = 0.88;
const STOP = 0.035;

const BALL_COLORS = {
  1:"#f0c91f",
  2:"#245bd2",
  3:"#df2632",
  4:"#6733a9",
  5:"#ed7817",
  6:"#148b4c",
  7:"#7d1822",
  8:"#111111",
  9:"#f0c91f",
  10:"#245bd2",
  11:"#df2632",
  12:"#6733a9",
  13:"#ed7817",
  14:"#148b4c",
  15:"#7d1822"
};

let balls = [];
let mouse = {x:420,y:400};
let currentPlayer = 1;
let playerType = {1:null,2:null};
let moving = false;
let shotPocketed = [];
let cueFoul = false;
let gameOver = false;

let lastTime = performance.now();
let accumulator = 0;
const FIXED_STEP = 1/120;

/* ==========================================================
   AUDIO
   ========================================================== */

let audioCtx = null;
let masterGain = null;
let soundOn = true;
let audioReady = false;
let lastBallSound = 0;
let lastRailSound = 0;

function startAudio(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    masterGain = audioCtx.createGain();

    /*
      Gain moteur à 100 %.
      Pas de réduction globale silencieuse.
    */
    masterGain.gain.value = 1.0;
    masterGain.connect(audioCtx.destination);
  }

  if(audioCtx.state === "suspended"){
    audioCtx.resume();
  }

  audioReady = true;
}

function oscillatorSound({
  frequency=200,
  endFrequency=null,
  duration=.08,
  volume=.5,
  type="sine",
  delay=0
}={}){
  if(!soundOn || !audioReady || !audioCtx) return;

  const t = audioCtx.currentTime + delay;

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = type;
  osc.frequency.setValueAtTime(frequency,t);

  if(endFrequency){
    osc.frequency.exponentialRampToValueAtTime(
      Math.max(20,endFrequency),
      t + duration
    );
  }

  gain.gain.setValueAtTime(.0001,t);
  gain.gain.exponentialRampToValueAtTime(
    Math.max(.0001,volume),
    t+.004
  );
  gain.gain.exponentialRampToValueAtTime(
    .0001,
    t+duration
  );

  osc.connect(gain);
  gain.connect(masterGain);

  osc.start(t);
  osc.stop(t+duration+.03);
}

function noiseSound(duration=.08,volume=.3,lowpass=1000){
  if(!soundOn || !audioReady || !audioCtx) return;

  const length = Math.floor(audioCtx.sampleRate*duration);
  const buffer = audioCtx.createBuffer(
    1,
    length,
    audioCtx.sampleRate
  );

  const data = buffer.getChannelData(0);

  for(let i=0;i<length;i++){
    data[i]=(Math.random()*2-1) *
      Math.pow(1-i/length,2);
  }

  const source=audioCtx.createBufferSource();
  source.buffer=buffer;

  const filter=audioCtx.createBiquadFilter();
  filter.type="lowpass";
  filter.frequency.value=lowpass;

  const gain=audioCtx.createGain();
  gain.gain.value=volume;

  source.connect(filter);
  filter.connect(gain);
  gain.connect(masterGain);

  source.start();
}

function soundCue(power){
  startAudio();

  oscillatorSound({
    frequency:310,
    endFrequency:170,
    duration:.045,
    volume:.55 + power*.003,
    type:"triangle"
  });

  oscillatorSound({
    frequency:105,
    duration:.07,
    volume:.55,
    type:"sine",
    delay:.005
  });

  noiseSound(.035,.25,1300);
}

function soundBall(impact){
  const now=performance.now();

  if(now-lastBallSound<16) return;
  lastBallSound=now;

  const v=Math.min(.72,.20+impact*.022);

  oscillatorSound({
    frequency:330+Math.random()*35,
    endFrequency:210,
    duration:.045,
    volume:v,
    type:"triangle"
  });

  oscillatorSound({
    frequency:145,
    duration:.035,
    volume:v*.45,
    type:"sine"
  });
}

function soundRail(impact){
  const now=performance.now();

  if(now-lastRailSound<20) return;
  lastRailSound=now;

  const v=Math.min(.65,.18+impact*.018);

  oscillatorSound({
    frequency:125,
    endFrequency:80,
    duration:.055,
    volume:v,
    type:"triangle"
  });

  noiseSound(.035,v*.22,700);
}

function soundPocket(){
  oscillatorSound({
    frequency:180,
    endFrequency:70,
    duration:.18,
    volume:.75,
    type:"sine"
  });

  oscillatorSound({
    frequency:90,
    endFrequency:48,
    duration:.26,
    volume:.65,
    type:"triangle",
    delay:.035
  });

  noiseSound(.11,.30,500);
}

function soundWin(){
  oscillatorSound({
    frequency:392,
    duration:.13,
    volume:.55,
    type:"triangle"
  });

  oscillatorSound({
    frequency:523,
    duration:.16,
    volume:.6,
    type:"triangle",
    delay:.12
  });

  oscillatorSound({
    frequency:659,
    duration:.24,
    volume:.65,
    type:"triangle",
    delay:.25
  });
}

soundButton.addEventListener("click",()=>{
  startAudio();
  soundOn=!soundOn;

  soundButton.textContent =
    soundOn ? "🔊 SON 100%" : "🔇 SON COUPÉ";
});

/* ==========================================================
   CANVAS
   ========================================================== */

function resize(){
  const rect=canvas.getBoundingClientRect();
  const dpr=Math.min(window.devicePixelRatio||1,2);

  canvas.width=Math.round(rect.width*dpr);
  canvas.height=Math.round(rect.height*dpr);

  ctx.setTransform(
    canvas.width/W,
    0,
    0,
    canvas.height/H,
    0,
    0
  );
}

window.addEventListener("resize",resize);

/* ==========================================================
   BALL
   ========================================================== */

class Ball{
  constructor(number,x,y){
    this.number=number;
    this.x=x;
    this.y=y;
    this.vx=0;
    this.vy=0;
    this.pocketed=false;
  }

  get speed(){
    return Math.hypot(this.vx,this.vy);
  }

  update(dt){
    if(this.pocketed) return;

    this.x += this.vx*dt*120;
    this.y += this.vy*dt*120;

    const damp=Math.pow(FRICTION,dt*120);

    this.vx*=damp;
    this.vy*=damp;

    if(Math.abs(this.vx)<STOP) this.vx=0;
    if(Math.abs(this.vy)<STOP) this.vy=0;
  }
}

/* ==========================================================
   INITIALISATION
   ========================================================== */

function newGame(){
  balls=[];
  currentPlayer=1;
  playerType={1:null,2:null};
  moving=false;
  shotPocketed=[];
  cueFoul=false;
  gameOver=false;

  balls.push(new Ball(0,430,400));

  const rackX=1050;
  const rackY=400;

  const dx=R*1.78;
  const dy=R*2.06;

  const rack=[
    [1],
    [9,2],
    [3,8,10],
    [11,4,12,5],
    [6,13,7,14,15]
  ];

  rack.forEach((row,column)=>{
    row.forEach((number,index)=>{
      balls.push(
        new Ball(
          number,
          rackX+column*dx,
          rackY+(index-(row.length-1)/2)*dy
        )
      );
    });
  });

  mouse={x:850,y:400};

  statusEl.textContent="Vise puis clique pour casser";
  updateHUD();
}

function cueBall(){
  return balls.find(b=>b.number===0);
}

function ballsStopped(){
  return balls.every(
    b=>b.pocketed || b.speed<STOP
  );
}

/* ==========================================================
   POCHES
   ========================================================== */

function pockets(){
  return [
    {x:PLAY.left,y:PLAY.top},
    {x:(PLAY.left+PLAY.right)/2,y:PLAY.top-5},
    {x:PLAY.right,y:PLAY.top},
    {x:PLAY.left,y:PLAY.bottom},
    {x:(PLAY.left+PLAY.right)/2,y:PLAY.bottom+5},
    {x:PLAY.right,y:PLAY.bottom}
  ];
}

function pocketCheck(ball){
  for(const p of pockets()){
    if(Math.hypot(ball.x-p.x,ball.y-p.y)<POCKET_R){
      ball.pocketed=true;
      ball.vx=0;
      ball.vy=0;

      soundPocket();

      if(ball.number===0){
        cueFoul=true;
      }else{
        shotPocketed.push(ball.number);
      }

      return;
    }
  }
}

/* ==========================================================
   COLLISIONS BANDES
   ========================================================== */

function cushion(ball){
  let impact=0;
  let hit=false;

  if(ball.x-R<PLAY.left){
    impact=Math.abs(ball.vx);
    ball.x=PLAY.left+R;
    ball.vx=Math.abs(ball.vx)*CUSHION_RESTITUTION;
    hit=true;
  }

  if(ball.x+R>PLAY.right){
    impact=Math.max(impact,Math.abs(ball.vx));
    ball.x=PLAY.right-R;
    ball.vx=-Math.abs(ball.vx)*CUSHION_RESTITUTION;
    hit=true;
  }

  if(ball.y-R<PLAY.top){
    impact=Math.max(impact,Math.abs(ball.vy));
    ball.y=PLAY.top+R;
    ball.vy=Math.abs(ball.vy)*CUSHION_RESTITUTION;
    hit=true;
  }

  if(ball.y+R>PLAY.bottom){
    impact=Math.max(impact,Math.abs(ball.vy));
    ball.y=PLAY.bottom-R;
    ball.vy=-Math.abs(ball.vy)*CUSHION_RESTITUTION;
    hit=true;
  }

  if(hit && impact>.7){
    soundRail(impact);
  }
}

/* ==========================================================
   COLLISIONS BILLES
   ========================================================== */

function collide(a,b){
  let dx=b.x-a.x;
  let dy=b.y-a.y;

  let dist=Math.hypot(dx,dy);

  const minimum=R*2;

  if(dist===0){
    dx=.01;
    dy=0;
    dist=.01;
  }

  if(dist>=minimum) return;

  const nx=dx/dist;
  const ny=dy/dist;

  const overlap=minimum-dist;

  a.x-=nx*overlap*.5;
  a.y-=ny*overlap*.5;

  b.x+=nx*overlap*.5;
  b.y+=ny*overlap*.5;

  const relativeX=b.vx-a.vx;
  const relativeY=b.vy-a.vy;

  const normalVelocity=
    relativeX*nx+
    relativeY*ny;

  if(normalVelocity>0) return;

  const impulse=
    -(1+RESTITUTION)*
    normalVelocity/2;

  const ix=impulse*nx;
  const iy=impulse*ny;

  a.vx-=ix;
  a.vy-=iy;

  b.vx+=ix;
  b.vy+=iy;

  if(Math.abs(normalVelocity)>.55){
    soundBall(Math.abs(normalVelocity));
  }
}

/* ==========================================================
   PHYSIQUE
   ========================================================== */

function physics(dt){
  for(const ball of balls){
    ball.update(dt);

    if(ball.pocketed) continue;

    pocketCheck(ball);

    if(!ball.pocketed){
      cushion(ball);
    }
  }

  for(let i=0;i<balls.length;i++){
    const a=balls[i];

    if(a.pocketed) continue;

    for(let j=i+1;j<balls.length;j++){
      const b=balls[j];

      if(!b.pocketed){
        collide(a,b);
      }
    }
  }
}

/* ==========================================================
   RÈGLES SIMPLIFIÉES 8 BALL
   ========================================================== */

function remaining(type){
  return balls.filter(ball=>{
    if(ball.pocketed) return false;

    if(type==="PLEINES"){
      return ball.number>=1 && ball.number<=7;
    }

    return ball.number>=9 && ball.number<=15;
  }).length;
}

function switchPlayer(){
  currentPlayer=currentPlayer===1?2:1;
  updateHUD();
}

function respawnWhite(){
  const white=cueBall();

  white.pocketed=false;
  white.vx=0;
  white.vy=0;

  white.x=430;
  white.y=400;

  let tries=0;

  while(
    balls.some(
      b=>
        b!==white &&
        !b.pocketed &&
        Math.hypot(b.x-white.x,b.y-white.y)<R*2.2
    ) &&
    tries<60
  ){
    white.x-=8;
    tries++;
  }
}

function finishShot(){
  if(!moving || !ballsStopped()) return;

  moving=false;

  if(cueFoul){
    respawnWhite();
    cueFoul=false;
    shotPocketed=[];
    switchPlayer();

    statusEl.textContent=
      "Faute : bille blanche empochée";

    return;
  }

  if(shotPocketed.includes(8)){
    const type=playerType[currentPlayer];

    if(type && remaining(type)===0){
      statusEl.textContent=
        `Joueur ${currentPlayer} gagne !`;
    }else{
      const winner=currentPlayer===1?2:1;

      statusEl.textContent=
        `Joueur ${winner} gagne !`;
    }

    gameOver=true;
    soundWin();
    return;
  }

  const colours=
    shotPocketed.filter(n=>n!==8);

  if(
    !playerType[1] &&
    colours.length
  ){
    const first=colours[0];

    const chosen=
      first<=7 ?
      "PLEINES" :
      "RAYÉES";

    playerType[currentPlayer]=chosen;

    playerType[
      currentPlayer===1?2:1
    ]=
      chosen==="PLEINES" ?
      "RAYÉES" :
      "PLEINES";
  }

  let legal=false;

  if(colours.length && playerType[currentPlayer]){
    legal=colours.some(n=>{
      if(playerType[currentPlayer]==="PLEINES"){
        return n>=1 && n<=7;
      }

      return n>=9 && n<=15;
    });
  }

  if(legal){
    statusEl.textContent=
      `Joueur ${currentPlayer} rejoue`;
  }else{
    switchPlayer();

    statusEl.textContent=
      `Au joueur ${currentPlayer}`;
  }

  shotPocketed=[];
  updateHUD();
}

/* ==========================================================
   HUD
   ========================================================== */

function updateHUD(){
  p1El.classList.toggle(
    "active",
    currentPlayer===1
  );

  p2El.classList.toggle(
    "active",
    currentPlayer===2
  );

  p1El.textContent=
    "JOUEUR 1 • "+
    (
      playerType[1] ?
      playerType[1] :
      "À déterminer"
    );

  p2El.textContent=
    "JOUEUR 2 • "+
    (
      playerType[2] ?
      playerType[2] :
      "À déterminer"
    );
}

/* ==========================================================
   CONTRÔLES
   La direction dépend uniquement de la position du pointeur.
   La puissance est séparée : elle ne peut plus faire partir
   la ligne de visée dans tous les sens.
   ========================================================== */

function pointerPosition(event){
  const rect=canvas.getBoundingClientRect();

  return {
    x:
      (event.clientX-rect.left)/
      rect.width*W,

    y:
      (event.clientY-rect.top)/
      rect.height*H
  };
}

canvas.addEventListener(
  "pointermove",
  event=>{
    if(
      moving ||
      gameOver ||
      !ballsStopped()
    ) return;

    mouse=pointerPosition(event);
  }
);

canvas.addEventListener(
  "pointerdown",
  event=>{
    event.preventDefault();

    startAudio();

    if(
      moving ||
      gameOver ||
      !ballsStopped()
    ) return;

    mouse=pointerPosition(event);

    shoot();
  }
);

function shoot(){
  const white=cueBall();

  if(white.pocketed) return;

  let dx=mouse.x-white.x;
  let dy=mouse.y-white.y;

  const length=Math.hypot(dx,dy);

  if(length<10) return;

  dx/=length;
  dy/=length;

  const percentage=
    Number(powerRange.value)/100;

  const force=
    8 + percentage*25;

  white.vx=dx*force;
  white.vy=dy*force;

  soundCue(percentage*100);

  moving=true;
  shotPocketed=[];
  cueFoul=false;

  statusEl.textContent=
    "Billes en mouvement…";
}

powerRange.addEventListener(
  "input",
  ()=>{
    const value=powerRange.value;

    powerFill.style.width=value+"%";
    powerValue.textContent=value+" %";
  }
);

newGameButton.addEventListener(
  "click",
  ()=>{
    startAudio();
    newGame();
  }
);

/* ==========================================================
   DESSIN TABLE
   ========================================================== */

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.roundRect(x,y,w,h,r);
}

function drawTable(){
  const background=
    ctx.createLinearGradient(0,0,0,H);

  background.addColorStop(
    0,
    "#07131f"
  );

  background.addColorStop(
    1,
    "#02070d"
  );

  ctx.fillStyle=background;
  ctx.fillRect(0,0,W,H);

  /* ombre générale */
  ctx.save();

  ctx.shadowColor=
    "rgba(0,0,0,.85)";

  ctx.shadowBlur=45;
  ctx.shadowOffsetY=20;

  roundRect(
    65,
    28,
    1470,
    744,
    45
  );

  const wood=
    ctx.createLinearGradient(
      0,0,0,H
    );

  wood.addColorStop(
    0,
    "#9a5b29"
  );

  wood.addColorStop(
    .16,
    "#51280f"
  );

  wood.addColorStop(
    .50,
    "#a56531"
  );

  wood.addColorStop(
    .82,
    "#48210c"
  );

  wood.addColorStop(
    1,
    "#875022"
  );

  ctx.fillStyle=wood;
  ctx.fill();

  ctx.restore();

  /* veines bois */
  ctx.save();

  roundRect(
    65,
    28,
    1470,
    744,
    45
  );

  ctx.clip();

  ctx.globalAlpha=.12;

  for(let i=0;i<42;i++){
    ctx.strokeStyle=
      i%2 ?
      "#160803" :
      "#e8a05c";

    ctx.lineWidth=
      1+Math.random()*2;

    ctx.beginPath();

    const y=
      Math.random()*H;

    ctx.moveTo(30,y);

    ctx.bezierCurveTo(
      450,
      y+Math.random()*20-10,
      1100,
      y+Math.random()*20-10,
      1570,
      y
    );

    ctx.stroke();
  }

  ctx.restore();

  /* intérieur noir */
  roundRect(
    104,
    67,
    1392,
    666,
    30
  );

  ctx.fillStyle="#121416";
  ctx.fill();

  /* tapis */
  const felt=
    ctx.createRadialGradient(
      800,
      350,
      50,
      800,
      400,
      750
    );

  felt.addColorStop(
    0,
    "#16a36e"
  );

  felt.addColorStop(
    .48,
    "#07845a"
  );

  felt.addColorStop(
    1,
    "#034a33"
  );

  roundRect(
    PLAY.left-R,
    PLAY.top-R,
    PLAY.right-PLAY.left+R*2,
    PLAY.bottom-PLAY.top+R*2,
    17
  );

  ctx.fillStyle=felt;
  ctx.fill();

  /* texture tapis */
  ctx.save();

  ctx.globalAlpha=.045;

  for(let i=0;i<260;i++){
    const x=
      PLAY.left+
      Math.random()*
      (PLAY.right-PLAY.left);

    const y=
      PLAY.top+
      Math.random()*
      (PLAY.bottom-PLAY.top);

    ctx.fillStyle=
      i%2 ?
      "#ffffff" :
      "#00180e";

    ctx.fillRect(x,y,1.5,1.5);
  }

  ctx.restore();

  /* losanges */
  ctx.fillStyle=
    "rgba(255,255,255,.72)";

  for(let i=1;i<8;i++){
    const x=
      PLAY.left+
      (PLAY.right-PLAY.left)*
      i/8;

    diamond(x,82);
    diamond(x,718);
  }

  for(let i=1;i<4;i++){
    const y=
      PLAY.top+
      (PLAY.bottom-PLAY.top)*
      i/4;

    diamond(126,y);
    diamond(1474,y);
  }

  /* poches */
  for(const p of pockets()){
    const pocket=
      ctx.createRadialGradient(
        p.x-7,
        p.y-7,
        3,
        p.x,
        p.y,
        POCKET_R+9
      );

    pocket.addColorStop(
      0,
      "#000"
    );

    pocket.addColorStop(
      .65,
      "#000"
    );

    pocket.addColorStop(
      1,
      "#292929"
    );

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      POCKET_R+8,
      0,
      Math.PI*2
    );

    ctx.fillStyle=pocket;
    ctx.fill();

    ctx.strokeStyle=
      "rgba(0,0,0,.75)";

    ctx.lineWidth=5;
    ctx.stroke();
  }
}

function diamond(x,y){
  ctx.save();

  ctx.translate(x,y);
  ctx.rotate(Math.PI/4);

  ctx.fillRect(
    -3,
    -3,
    6,
    6
  );

  ctx.restore();
}

/* ==========================================================
   DESSIN BILLES
   ========================================================== */

function drawBall(ball){
  if(ball.pocketed) return;

  ctx.save();

  ctx.shadowColor=
    "rgba(0,0,0,.65)";

  ctx.shadowBlur=11;
  ctx.shadowOffsetX=6;
  ctx.shadowOffsetY=8;

  const colour=
    ball.number===0 ?
    "#f4f3eb" :
    BALL_COLORS[ball.number];

  const gradient=
    ctx.createRadialGradient(
      ball.x-R*.42,
      ball.y-R*.48,
      2,
      ball.x,
      ball.y,
      R*1.15
    );

  gradient.addColorStop(
    0,
    "#ffffff"
  );

  gradient.addColorStop(
    .18,
    colour
  );

  gradient.addColorStop(
    .70,
    colour
  );

  gradient.addColorStop(
    1,
    "#06090d"
  );

  ctx.beginPath();

  ctx.arc(
    ball.x,
    ball.y,
    R,
    0,
    Math.PI*2
  );

  ctx.fillStyle=gradient;
  ctx.fill();

  ctx.shadowColor="transparent";

  /* bande blanche rayées */
  if(ball.number>=9){
    ctx.save();

    ctx.beginPath();

    ctx.arc(
      ball.x,
      ball.y,
      R-.6,
      0,
      Math.PI*2
    );

    ctx.clip();

    ctx.fillStyle="#f4f1e7";

    ctx.fillRect(
      ball.x-R,
      ball.y-7,
      R*2,
      14
    );

    ctx.restore();
  }

  /* numéro */
  if(ball.number!==0){
    ctx.beginPath();

    ctx.arc(
      ball.x,
      ball.y,
      8.5,
      0,
      Math.PI*2
    );

    ctx.fillStyle="#f7f5ec";
    ctx.fill();

    ctx.fillStyle="#111";

    ctx.font=
      "bold 10px Arial";

    ctx.textAlign="center";
    ctx.textBaseline="middle";

    ctx.fillText(
      ball.number,
      ball.x,
      ball.y+.5
    );
  }

  /* reflet brillant */
  ctx.beginPath();

  ctx.ellipse(
    ball.x-R*.40,
    ball.y-R*.46,
    R*.28,
    R*.16,
    -.55,
    0,
    Math.PI*2
  );

  ctx.fillStyle=
    "rgba(255,255,255,.68)";

  ctx.fill();

  ctx.restore();
}

/* ==========================================================
   VISÉE STABLE
   ========================================================== */

function drawAim(){
  if(
    moving ||
    gameOver ||
    !ballsStopped()
  ) return;

  const white=cueBall();

  if(white.pocketed) return;

  let dx=mouse.x-white.x;
  let dy=mouse.y-white.y;

  const length=Math.hypot(dx,dy);

  if(length<5) return;

  dx/=length;
  dy/=length;

  let maxDistance=1200;

  /*
    Détection de la première bille sur la trajectoire.
  */
  for(const ball of balls){
    if(
      ball===white ||
      ball.pocketed
    ) continue;

    const ox=ball.x-white.x;
    const oy=ball.y-white.y;

    const projection=
      ox*dx+
      oy*dy;

    if(projection<=0) continue;

    const perpendicular=
      Math.abs(
        ox*dy-
        oy*dx
      );

    if(perpendicular<R*2){
      const offset=
        Math.sqrt(
          Math.max(
            0,
            (R*2)*(R*2)-
            perpendicular*
            perpendicular
          )
        );

      const hit=
        projection-offset;

      if(hit<maxDistance){
        maxDistance=hit;
      }
    }
  }

  maxDistance=
    Math.min(
      maxDistance,
      1200
    );

  ctx.save();

  /* ligne principale */
  ctx.setLineDash([11,9]);

  ctx.strokeStyle=
    "rgba(255,255,255,.92)";

  ctx.lineWidth=2;

  ctx.beginPath();

  ctx.moveTo(
    white.x,
    white.y
  );

  ctx.lineTo(
    white.x+
    dx*maxDistance,
    white.y+
    dy*maxDistance
  );

  ctx.stroke();

  ctx.setLineDash([]);

  /* cercle fantôme */
  if(maxDistance<1190){
    const gx=
      white.x+
      dx*maxDistance;

    const gy=
      white.y+
      dy*maxDistance;

    ctx.beginPath();

    ctx.arc(
      gx,
      gy,
      R,
      0,
      Math.PI*2
    );

    ctx.strokeStyle=
      "rgba(255,255,255,.50)";

    ctx.lineWidth=2;
    ctx.stroke();
  }

  ctx.restore();
}

/* ==========================================================
   QUEUE
   ========================================================== */

function drawCue(){
  if(
    moving ||
    gameOver ||
    !ballsStopped()
  ) return;

  const white=cueBall();

  if(white.pocketed) return;

  let dx=mouse.x-white.x;
  let dy=mouse.y-white.y;

  const length=Math.hypot(dx,dy);

  if(length<5) return;

  dx/=length;
  dy/=length;

  const gap=R+18;
  const cueLength=390;

  const startX=
    white.x-dx*gap;

  const startY=
    white.y-dy*gap;

  const endX=
    white.x-
    dx*(gap+cueLength);

  const endY=
    white.y-
    dy*(gap+cueLength);

  ctx.save();

  ctx.lineCap="round";

  /* ombre */
  ctx.strokeStyle=
    "rgba(0,0,0,.55)";

  ctx.lineWidth=13;

  ctx.beginPath();

  ctx.moveTo(
    startX+5,
    startY+7
  );

  ctx.lineTo(
    endX+5,
    endY+7
  );

  ctx.stroke();

  /* bois */
  const gradient=
    ctx.createLinearGradient(
      startX,
      startY,
      endX,
      endY
    );

  gradient.addColorStop(
    0,
    "#f5dfb2"
  );

  gradient.addColorStop(
    .35,
    "#dba45b"
  );

  gradient.addColorStop(
    .68,
    "#85431e"
  );

  gradient.addColorStop(
    1,
    "#33130a"
  );

  ctx.strokeStyle=gradient;
  ctx.lineWidth=9;

  ctx.beginPath();

  ctx.moveTo(
    startX,
    startY
  );

  ctx.lineTo(
    endX,
    endY
  );

  ctx.stroke();

  /* procédé bleu */
  ctx.strokeStyle="#49c5ff";
  ctx.lineWidth=6;

  ctx.beginPath();

  ctx.moveTo(
    startX,
    startY
  );

  ctx.lineTo(
    startX-dx*10,
    startY-dy*10
  );

  ctx.stroke();

  ctx.restore();
}

/* ==========================================================
   RENDU
   ========================================================== */

function draw(){
  drawTable();
  drawAim();

  for(const ball of balls){
    drawBall(ball);
  }

  drawCue();
}

/* ==========================================================
   BOUCLE
   ========================================================== */

function loop(now){
  const delta=
    Math.min(
      .032,
      (now-lastTime)/1000
    );

  lastTime=now;

  accumulator+=delta;

  while(
    accumulator>=FIXED_STEP
  ){
    physics(FIXED_STEP);
    accumulator-=FIXED_STEP;
  }

  finishShot();
  draw();

  requestAnimationFrame(loop);
}

/* ==========================================================
   DÉMARRAGE
   ========================================================== */

resize();
newGame();
requestAnimationFrame(loop);

</script>
