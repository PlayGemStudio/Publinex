<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Publinex 8 Ball</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  font-family:Segoe UI,Arial,sans-serif;
  color:#fff;
  background:#020812;
  user-select:none;
}
#game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 15%,rgba(31,111,139,.45),transparent 32%),
    linear-gradient(#071825 0 57%,#02070c 100%);
}
.room{
  position:absolute;inset:0;
  overflow:hidden;
}
.ceiling{
  position:absolute;left:0;right:0;top:0;height:17%;
  background:linear-gradient(#02070b,#09151d);
  border-bottom:2px solid rgba(255,255,255,.05);
}
.lamp{
  position:absolute;top:7%;width:20%;height:5%;
  border-radius:50%;
  background:linear-gradient(#0b1013,#272f31,#090d0f);
  box-shadow:0 18px 50px rgba(255,215,120,.28);
}
.lamp:after{
  content:"";position:absolute;left:10%;right:10%;top:55%;height:180%;
  background:linear-gradient(90deg,transparent,rgba(255,220,145,.13),transparent);
  clip-path:polygon(20% 0,80% 0,100% 100%,0 100%);
}
.l1{left:13%}.l2{right:13%}

.wallGlow{
  position:absolute;left:10%;right:10%;top:14%;height:27%;
  background:
    radial-gradient(circle at 20% 40%,rgba(0,157,255,.17),transparent 22%),
    radial-gradient(circle at 80% 40%,rgba(0,157,255,.17),transparent 22%);
}
.sign{
  position:absolute;top:18%;left:50%;transform:translateX(-50%);
  font-weight:900;font-size:clamp(20px,2.5vw,42px);
  letter-spacing:4px;color:#eaf8ff;
  text-shadow:0 0 8px #16a9ff,0 0 24px #087bc1;
}
.sign span{color:#30b4ff}
.poster{
  position:absolute;top:19%;
  width:11%;height:14%;
  border:4px solid #352519;
  background:linear-gradient(135deg,#222,#090909);
  box-shadow:0 10px 25px #000;
  display:flex;align-items:center;justify-content:center;
  text-align:center;font-weight:900;font-size:clamp(8px,1vw,15px);
  color:#d9c9a8;
}
.poster.left{left:7%}.poster.right{right:7%}

.crowd{
  position:absolute;left:0;right:0;top:30%;height:28%;
  overflow:hidden;
  opacity:.85;
}
.person{
  position:absolute;bottom:0;
  width:32px;height:92px;
  transform-origin:bottom center;
  animation:sway 3s ease-in-out infinite alternate;
}
.person:before{
  content:"";position:absolute;top:0;left:7px;
  width:18px;height:18px;border-radius:50%;
  background:#b77b57;
  box-shadow:0 0 8px rgba(255,190,140,.12);
}
.person:after{
  content:"";position:absolute;top:17px;left:2px;
  width:28px;height:72px;border-radius:10px 10px 4px 4px;
  background:linear-gradient(90deg,#0a1118,#1b3343,#080d12);
}
@keyframes sway{
  from{transform:rotate(-1.2deg)}
  to{transform:rotate(1.2deg)}
}

.topbar{
  position:absolute;z-index:20;left:0;right:0;top:0;height:58px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;
  background:linear-gradient(rgba(2,8,15,.97),rgba(3,14,25,.88));
  border-bottom:1px solid rgba(74,180,255,.18);
}
.logo{font-size:23px;font-weight:900;letter-spacing:-1px}
.logo b{color:#31afff}
.score{
  position:absolute;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:18px;font-weight:900
}
.score strong{font-size:23px}
.score small{color:#8faac0}
.buttons{display:flex;gap:8px}
button{
  border:1px solid rgba(255,255,255,.15);
  background:linear-gradient(#17334c,#091a2a);
  color:#fff;border-radius:9px;padding:8px 12px;
  font-weight:800;cursor:pointer
}
button:hover{filter:brightness(1.18)}

.tableArea{
  position:absolute;
  z-index:10;
  left:50%;
  top:56%;
  transform:translate(-50%,-50%);
  width:min(1120px,86vw);
  aspect-ratio:2/1;
  filter:drop-shadow(0 32px 32px rgba(0,0,0,.72));
}
canvas{
  width:100%;height:100%;display:block;
  touch-action:none;cursor:crosshair;
}
.bottom{
  position:absolute;z-index:30;
  left:50%;bottom:10px;transform:translateX(-50%);
  width:min(900px,92vw);
  min-height:54px;
  display:flex;align-items:center;justify-content:center;
  gap:15px;padding:8px 16px;
  border:1px solid rgba(255,255,255,.1);
  border-radius:15px;
  background:rgba(2,10,18,.88);
  box-shadow:0 10px 30px #000;
}
#message{
  min-width:240px;text-align:center;
  color:#dcefff;font-size:13px;font-weight:800
}
.meter{
  width:min(350px,34vw);height:13px;
  background:#02060a;border-radius:99px;overflow:hidden;
  border:1px solid rgba(255,255,255,.14)
}
#meterFill{
  height:100%;width:0;
  background:linear-gradient(90deg,#24b9ff,#29d98c 50%,#ffd53c 76%,#ff4545);
}
#powerText{width:50px;font-weight:900;font-size:12px}
@media(max-width:800px){
  .tableArea{width:96vw;top:54%}
  .poster,.crowd{opacity:.45}
  .logo{font-size:18px}
  .score small{display:none}
  button{font-size:11px;padding:7px}
  .bottom{bottom:4px}
}
</style>
</head>

<body>
<div id="game">
  <div class="room">
    <div class="ceiling"></div>
    <div class="lamp l1"></div>
    <div class="lamp l2"></div>
    <div class="wallGlow"></div>
    <div class="sign">PUBLI<b>NEX</b> 8 BALL</div>
    <div class="poster left">GOOD<br>GAME</div>
    <div class="poster right">BILLIARDS<br>CLUB</div>
    <div id="crowd" class="crowd"></div>
  </div>

  <div class="topbar">
    <div class="logo">Publi<b>nex</b></div>

    <div class="score">
      <span id="p1">JOUEUR 1</span>
      <strong id="score">0 — 0</strong>
      <span id="p2">JOUEUR 2</span>
      <small>8 BALL</small>
    </div>

    <div class="buttons">
      <button id="musicBtn">♫ MUSIQUE</button>
      <button id="soundBtn">🔊 SON</button>
      <button id="newBtn">↻ PARTIE</button>
      <button onclick="location.href='jeux.html'">RETOUR</button>
    </div>
  </div>

  <div class="tableArea">
    <canvas id="pool"></canvas>
  </div>

  <div class="bottom">
    <div id="message">Déplace la souris pour viser</div>
    <div class="meter"><div id="meterFill"></div></div>
    <div id="powerText">0 %</div>
  </div>
</div>

<script>
"use strict";

const canvas=document.getElementById("pool");
const ctx=canvas.getContext("2d");
const meter=document.getElementById("meterFill");
const powerText=document.getElementById("powerText");
const message=document.getElementById("message");
const musicBtn=document.getElementById("musicBtn");
const soundBtn=document.getElementById("soundBtn");

const W=1200,H=600;
const R=18;

const T={
  l:118,r:1082,t:92,b:508,
  pocket:34
};

let balls=[];
let pointer={x:340,y:300};
let aimingAngle=0;

let pulling=false;
let pullStart=null;
let pullDistance=0;

let moving=false;
let gameOver=false;

let last=performance.now();
let acc=0;
const STEP=1/120;

const friction=.9915;
const bounce=.91;
const restitution=.97;

const colours={
  1:"#f5d31e",2:"#2565d9",3:"#e23338",4:"#7337ae",
  5:"#ee7b18",6:"#159257",7:"#801d27",8:"#111318",
  9:"#f5d31e",10:"#2565d9",11:"#e23338",12:"#7337ae",
  13:"#ee7b18",14:"#159257",15:"#801d27"
};

/* ---------- PUBLIC ANIMÉ ---------- */

const crowd=document.getElementById("crowd");

for(let i=0;i<38;i++){
  const p=document.createElement("div");
  p.className="person";
  p.style.left=(i*2.7+Math.random()*2)+"%";
  p.style.height=(70+Math.random()*35)+"px";
  p.style.animationDelay=(-Math.random()*3)+"s";
  p.style.animationDuration=(2.3+Math.random()*2)+"s";
  p.style.opacity=(.35+Math.random()*.55);
  crowd.appendChild(p);
}

/* ---------- AUDIO ---------- */

let ac=null;
let master=null;
let musicGain=null;
let fxGain=null;
let musicOn=true;
let soundOn=true;
let musicStarted=false;
let musicTimer=null;
let musicStep=0;

function audioStart(){
  if(!ac){
    ac=new (window.AudioContext||window.webkitAudioContext)();

    master=ac.createGain();
    musicGain=ac.createGain();
    fxGain=ac.createGain();

    /*
      Sortie jeu pleine échelle.
      Les sous-mix sont équilibrés séparément.
    */
    master.gain.value=.95;
    musicGain.gain.value=.24;
    fxGain.gain.value=.92;

    musicGain.connect(master);
    fxGain.connect(master);
    master.connect(ac.destination);
  }

  if(ac.state==="suspended") ac.resume();

  if(musicOn&&!musicStarted){
    startMusic();
  }
}

function osc(freq,dur,vol,type="sine",destination=fxGain,delay=0,end=null){
  if(!ac||!destination)return;

  const t=ac.currentTime+delay;
  const o=ac.createOscillator();
  const g=ac.createGain();

  o.type=type;
  o.frequency.setValueAtTime(freq,t);

  if(end){
    o.frequency.exponentialRampToValueAtTime(Math.max(25,end),t+dur);
  }

  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(Math.max(.001,vol),t+.008);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);

  o.connect(g);
  g.connect(destination);

  o.start(t);
  o.stop(t+dur+.03);
}

function noise(dur,vol,cutoff){
  if(!ac||!soundOn)return;

  const n=Math.floor(ac.sampleRate*dur);
  const buffer=ac.createBuffer(1,n,ac.sampleRate);
  const data=buffer.getChannelData(0);

  for(let i=0;i<n;i++){
    data[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
  }

  const src=ac.createBufferSource();
  const filter=ac.createBiquadFilter();
  const gain=ac.createGain();

  src.buffer=buffer;
  filter.type="lowpass";
  filter.frequency.value=cutoff;
  gain.gain.value=vol;

  src.connect(filter);
  filter.connect(gain);
  gain.connect(fxGain);
  src.start();
}

/*
  Musique originale générée en temps réel.
  Lounge / jeu sportif, sans fichier musical externe.
*/
const bass=[55,55,65.41,55,73.42,65.41,49,55];
const chords=[
  [220,261.63,329.63],
  [220,261.63,329.63],
  [196,246.94,293.66],
  [220,261.63,329.63],
  [174.61,220,261.63],
  [196,246.94,293.66],
  [164.81,220,246.94],
  [196,246.94,293.66]
];

function musicBeat(){
  if(!ac||!musicOn)return;

  const step=musicStep%8;

  osc(bass[step],.46,.12,"sine",musicGain);

  chords[step].forEach((f,i)=>{
    osc(f,.7,.025,"triangle",musicGain,i*.012);
  });

  if(step%2===0){
    osc(880,.035,.018,"sine",musicGain);
  }

  if(step===3||step===7){
    osc(110,.06,.025,"triangle",musicGain);
  }

  musicStep++;
}

function startMusic(){
  if(musicStarted)return;
  musicStarted=true;
  musicBeat();
  musicTimer=setInterval(musicBeat,520);
}

function stopMusic(){
  if(musicTimer)clearInterval(musicTimer);
  musicTimer=null;
  musicStarted=false;
}

function cueSound(power){
  if(!soundOn)return;
  osc(240,.05,.5,"triangle",fxGain,0,125);
  osc(95,.07,.45,"sine",fxGain,.005);
  noise(.025,.16,1500);
}

let lastHitSound=0;

function ballSound(impact){
  if(!soundOn)return;

  const now=performance.now();
  if(now-lastHitSound<14)return;
  lastHitSound=now;

  const v=Math.min(.65,.18+impact*.018);
  osc(350,.045,v,"triangle",fxGain,0,210);
  osc(145,.04,v*.45,"sine",fxGain);
}

function railSound(impact){
  if(!soundOn)return;
  const v=Math.min(.48,.13+impact*.015);
  osc(115,.055,v,"triangle",fxGain,0,70);
  noise(.025,v*.18,650);
}

function pocketSound(){
  if(!soundOn)return;
  osc(170,.16,.62,"sine",fxGain,0,65);
  osc(80,.23,.45,"triangle",fxGain,.03,42);
  noise(.08,.18,450);
}

musicBtn.onclick=()=>{
  audioStart();
  musicOn=!musicOn;

  if(musicOn){
    startMusic();
    musicGain.gain.value=.24;
    musicBtn.textContent="♫ MUSIQUE";
  }else{
    stopMusic();
    musicGain.gain.value=0;
    musicBtn.textContent="♫ COUPÉE";
  }
};

soundBtn.onclick=()=>{
  audioStart();
  soundOn=!soundOn;
  fxGain.gain.value=soundOn?.92:0;
  soundBtn.textContent=soundOn?"🔊 SON":"🔇 SON";
};

/* ---------- CANVAS ---------- */

function resize(){
  const r=canvas.getBoundingClientRect();
  const d=Math.min(devicePixelRatio||1,2);

  canvas.width=Math.round(r.width*d);
  canvas.height=Math.round(r.height*d);

  ctx.setTransform(
    canvas.width/W,0,
    0,canvas.height/H,
    0,0
  );
}

addEventListener("resize",resize);

/* ---------- BILLES ---------- */

class Ball{
  constructor(n,x,y){
    this.n=n;
    this.x=x;
    this.y=y;
    this.vx=0;
    this.vy=0;
    this.dead=false;
  }

  speed(){
    return Math.hypot(this.vx,this.vy);
  }

  update(dt){
    if(this.dead)return;

    this.x+=this.vx*dt*120;
    this.y+=this.vy*dt*120;

    const f=Math.pow(friction,dt*120);
    this.vx*=f;
    this.vy*=f;

    if(Math.abs(this.vx)<.045)this.vx=0;
    if(Math.abs(this.vy)<.045)this.vy=0;
  }
}

function reset(){
  balls=[];
  moving=false;
  pulling=false;
  pullDistance=0;
  gameOver=false;

  balls.push(new Ball(0,345,300));

  const x=790;
  const dx=R*1.79;
  const dy=R*2.07;

  const rack=[
    [1],
    [9,2],
    [3,8,10],
    [11,4,12,5],
    [6,13,7,14,15]
  ];

  rack.forEach((row,c)=>{
    row.forEach((n,i)=>{
      balls.push(new Ball(
        n,
        x+c*dx,
        300+(i-(row.length-1)/2)*dy
      ));
    });
  });

  pointer={x:690,y:300};
  aimingAngle=0;
  message.textContent="Déplace la souris pour viser";
  updatePower();
}

document.getElementById("newBtn").onclick=()=>{
  audioStart();
  reset();
};

function white(){
  return balls[0];
}

function stopped(){
  return balls.every(b=>b.dead||b.speed()<.045);
}

function pockets(){
  return[
    {x:T.l,y:T.t},
    {x:(T.l+T.r)/2,y:T.t-4},
    {x:T.r,y:T.t},
    {x:T.l,y:T.b},
    {x:(T.l+T.r)/2,y:T.b+4},
    {x:T.r,y:T.b}
  ];
}

/* ---------- PHYSIQUE ---------- */

function pocketCheck(b){
  for(const p of pockets()){
    if(Math.hypot(b.x-p.x,b.y-p.y)<T.pocket){
      b.dead=true;
      b.vx=b.vy=0;
      pocketSound();

      if(b.n===0){
        setTimeout(()=>{
          b.dead=false;
          b.x=345;b.y=300;
          b.vx=b.vy=0;
        },450);
      }
      return;
    }
  }
}

function cushion(b){
  let hit=0;

  if(b.x-R<T.l){
    hit=Math.abs(b.vx);
    b.x=T.l+R;b.vx=Math.abs(b.vx)*bounce;
  }
  if(b.x+R>T.r){
    hit=Math.max(hit,Math.abs(b.vx));
    b.x=T.r-R;b.vx=-Math.abs(b.vx)*bounce;
  }
  if(b.y-R<T.t){
    hit=Math.max(hit,Math.abs(b.vy));
    b.y=T.t+R;b.vy=Math.abs(b.vy)*bounce;
  }
  if(b.y+R>T.b){
    hit=Math.max(hit,Math.abs(b.vy));
    b.y=T.b-R;b.vy=-Math.abs(b.vy)*bounce;
  }

  if(hit>.8)railSound(hit);
}

function collide(a,b){
  let dx=b.x-a.x;
  let dy=b.y-a.y;
  let d=Math.hypot(dx,dy);

  if(d===0){d=.01;dx=.01}
  if(d>=R*2)return;

  const nx=dx/d,ny=dy/d;
  const overlap=R*2-d;

  a.x-=nx*overlap*.5;
  a.y-=ny*overlap*.5;
  b.x+=nx*overlap*.5;
  b.y+=ny*overlap*.5;

  const rvx=b.vx-a.vx;
  const rvy=b.vy-a.vy;
  const vn=rvx*nx+rvy*ny;

  if(vn>0)return;

  const impulse=-(1+restitution)*vn/2;

  a.vx-=impulse*nx;
  a.vy-=impulse*ny;
  b.vx+=impulse*nx;
  b.vy+=impulse*ny;

  if(Math.abs(vn)>.5)ballSound(Math.abs(vn));
}

function physics(dt){
  balls.forEach(b=>{
    b.update(dt);
    if(!b.dead){
      pocketCheck(b);
      if(!b.dead)cushion(b);
    }
  });

  for(let i=0;i<balls.length;i++){
    if(balls[i].dead)continue;

    for(let j=i+1;j<balls.length;j++){
      if(!balls[j].dead)collide(balls[i],balls[j]);
    }
  }

  if(moving&&stopped()){
    moving=false;
    message.textContent="À toi de jouer";
  }
}

/* ---------- CONTRÔLE QUEUE ---------- */

function pos(e){
  const r=canvas.getBoundingClientRect();
  return{
    x:(e.clientX-r.left)/r.width*W,
    y:(e.clientY-r.top)/r.height*H
  };
}

canvas.addEventListener("pointermove",e=>{
  if(moving||gameOver)return;

  const p=pos(e);

  if(!pulling){
    pointer=p;

    const w=white();
    aimingAngle=Math.atan2(p.y-w.y,p.x-w.x);
  }else{
    /*
      Pendant le recul, l'angle est verrouillé.
      Seule la distance du mouvement opposé à la visée
      contrôle la puissance.
    */
    const dx=p.x-pullStart.x;
    const dy=p.y-pullStart.y;

    const backwards=
      -(dx*Math.cos(aimingAngle)+
        dy*Math.sin(aimingAngle));

    pullDistance=Math.max(0,Math.min(170,backwards));
    updatePower();
  }
});

canvas.addEventListener("pointerdown",e=>{
  audioStart();

  if(moving||gameOver||!stopped())return;

  pulling=true;
  pullStart=pos(e);
  pullDistance=0;
  canvas.setPointerCapture(e.pointerId);

  message.textContent="Recule la queue puis relâche";
});

canvas.addEventListener("pointerup",e=>{
  if(!pulling)return;

  pulling=false;

  if(pullDistance<7){
    pullDistance=0;
    updatePower();
    message.textContent="Recule davantage la queue";
    return;
  }

  shoot();
});

function updatePower(){
  const percent=Math.round(pullDistance/170*100);
  meter.style.width=percent+"%";
  powerText.textContent=percent+" %";
}

function shoot(){
  const b=white();
  const p=pullDistance/170;

  const force=7+p*29;

  b.vx=Math.cos(aimingAngle)*force;
  b.vy=Math.sin(aimingAngle)*force;

  cueSound(p*100);

  moving=true;
  pullDistance=0;
  updatePower();

  message.textContent="Billes en mouvement…";
}

/* ---------- TABLE ---------- */

function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.roundRect(x,y,w,h,r);
}

function table(){
  ctx.clearRect(0,0,W,H);

  ctx.save();
  ctx.shadowColor="rgba(0,0,0,.9)";
  ctx.shadowBlur=30;
  ctx.shadowOffsetY=16;

  rr(42,25,1116,550,38);

  const wood=ctx.createLinearGradient(0,25,0,575);
  wood.addColorStop(0,"#a96a31");
  wood.addColorStop(.16,"#4a210c");
  wood.addColorStop(.48,"#8d4d20");
  wood.addColorStop(.78,"#3a1808");
  wood.addColorStop(1,"#9a5928");

  ctx.fillStyle=wood;
  ctx.fill();
  ctx.restore();

  rr(73,56,1054,488,27);
  ctx.fillStyle="#12171a";
  ctx.fill();

  const felt=ctx.createRadialGradient(600,270,50,600,300,600);
  felt.addColorStop(0,"#16a875");
  felt.addColorStop(.55,"#07855c");
  felt.addColorStop(1,"#034b35");

  rr(T.l-R,T.t-R,T.r-T.l+R*2,T.b-T.t+R*2,16);
  ctx.fillStyle=felt;
  ctx.fill();

  /* rails */
  ctx.strokeStyle="rgba(0,0,0,.45)";
  ctx.lineWidth=5;
  rr(T.l-20,T.t-20,T.r-T.l+40,T.b-T.t+40,18);
  ctx.stroke();

  /* repères */
  ctx.fillStyle="rgba(240,230,205,.78)";

  for(let i=1;i<8;i++){
    const x=T.l+(T.r-T.l)*i/8;
    diamond(x,68);
    diamond(x,532);
  }

  for(const p of pockets()){
    const g=ctx.createRadialGradient(p.x-5,p.y-5,2,p.x,p.y,T.pocket+8);
    g.addColorStop(0,"#000");
    g.addColorStop(.7,"#010101");
    g.addColorStop(1,"#282828");

    ctx.beginPath();
    ctx.arc(p.x,p.y,T.pocket+7,0,Math.PI*2);
    ctx.fillStyle=g;
    ctx.fill();
  }
}

function diamond(x,y){
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(Math.PI/4);
  ctx.fillRect(-3,-3,6,6);
  ctx.restore();
}

/* ---------- RENDU BILLES ---------- */

function drawBall(b){
  if(b.dead)return;

  ctx.save();

  ctx.shadowColor="rgba(0,0,0,.65)";
  ctx.shadowBlur=10;
  ctx.shadowOffsetX=5;
  ctx.shadowOffsetY=7;

  const base=b.n===0?"#f7f5ed":colours[b.n];

  const g=ctx.createRadialGradient(
    b.x-R*.43,b.y-R*.48,1,
    b.x,b.y,R*1.15
  );

  g.addColorStop(0,"#fff");
  g.addColorStop(.18,base);
  g.addColorStop(.7,base);
  g.addColorStop(1,"#05070a");

  ctx.beginPath();
  ctx.arc(b.x,b.y,R,0,Math.PI*2);
  ctx.fillStyle=g;
  ctx.fill();

  ctx.shadowColor="transparent";

  if(b.n>=9){
    ctx.save();
    ctx.beginPath();
    ctx.arc(b.x,b.y,R-.7,0,Math.PI*2);
    ctx.clip();

    ctx.fillStyle="#f7f4ea";
    ctx.fillRect(b.x-R,b.y-7,R*2,14);
    ctx.restore();
  }

  if(b.n!==0){
    ctx.beginPath();
    ctx.arc(b.x,b.y,8.2,0,Math.PI*2);
    ctx.fillStyle="#faf8ef";
    ctx.fill();

    ctx.fillStyle="#111";
    ctx.font="bold 10px Arial";
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillText(b.n,b.x,b.y+.3);
  }

  ctx.beginPath();
  ctx.ellipse(
    b.x-R*.38,b.y-R*.45,
    R*.27,R*.15,-.55,0,Math.PI*2
  );
  ctx.fillStyle="rgba(255,255,255,.65)";
  ctx.fill();

  ctx.restore();
}

/* ---------- VISÉE ---------- */

function aim(){
  if(moving||gameOver)return;

  const b=white();
  if(b.dead)return;

  const dx=Math.cos(aimingAngle);
  const dy=Math.sin(aimingAngle);

  let distance=1000;

  balls.forEach(o=>{
    if(o===b||o.dead)return;

    const ox=o.x-b.x;
    const oy=o.y-b.y;
    const proj=ox*dx+oy*dy;

    if(proj<=0)return;

    const perp=Math.abs(ox*dy-oy*dx);

    if(perp<R*2){
      const offset=Math.sqrt(Math.max(0,(R*2)**2-perp**2));
      distance=Math.min(distance,proj-offset);
    }
  });

  ctx.save();
  ctx.setLineDash([8,7]);
  ctx.strokeStyle="rgba(255,255,255,.78)";
  ctx.lineWidth=1.7;

  ctx.beginPath();
  ctx.moveTo(b.x,b.y);
  ctx.lineTo(b.x+dx*Math.min(distance,850),b.y+dy*Math.min(distance,850));
  ctx.stroke();

  ctx.restore();
}

/* ---------- QUEUE MANUELLE ---------- */

function cue(){
  if(moving||gameOver)return;

  const b=white();
  if(b.dead)return;

  const dx=Math.cos(aimingAngle);
  const dy=Math.sin(aimingAngle);

  const gap=R+13+pullDistance;
  const len=350;

  const x1=b.x-dx*gap;
  const y1=b.y-dy*gap;
  const x2=b.x-dx*(gap+len);
  const y2=b.y-dy*(gap+len);

  ctx.save();
  ctx.lineCap="round";

  ctx.strokeStyle="rgba(0,0,0,.55)";
  ctx.lineWidth=12;
  ctx.beginPath();
  ctx.moveTo(x1+4,y1+6);
  ctx.lineTo(x2+4,y2+6);
  ctx.stroke();

  const g=ctx.createLinearGradient(x1,y1,x2,y2);
  g.addColorStop(0,"#f5e1b5");
  g.addColorStop(.38,"#d99b4f");
  g.addColorStop(.72,"#7c3618");
  g.addColorStop(1,"#291007");

  ctx.strokeStyle=g;
  ctx.lineWidth=8;
  ctx.beginPath();
  ctx.moveTo(x1,y1);
  ctx.lineTo(x2,y2);
  ctx.stroke();

  ctx.strokeStyle="#54c8ff";
  ctx.lineWidth=5;
  ctx.beginPath();
  ctx.moveTo(x1,y1);
  ctx.lineTo(x1-dx*8,y1-dy*8);
  ctx.stroke();

  ctx.restore();
}

function render(){
  table();
  aim();

  balls.forEach(drawBall);
  cue();
}

/* ---------- BOUCLE ---------- */

function loop(now){
  const dt=Math.min(.032,(now-last)/1000);
  last=now;
  acc+=dt;

  while(acc>=STEP){
    physics(STEP);
    acc-=STEP;
  }

  render();
  requestAnimationFrame(loop);
}

resize();
reset();
requestAnimationFrame(loop);

/*
  Les navigateurs bloquent la lecture automatique avec son.
  La première interaction sur le jeu initialise donc
  musique + effets audio.
*/
document.addEventListener("pointerdown",audioStart,{once:true});

</script>
