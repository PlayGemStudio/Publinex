<script>
"use strict";

/* =========================================================
   PUBLINEX 8 BALL
   ========================================================= */

const canvas = document.getElementById("table");
const ctx = canvas.getContext("2d");

const powerFill = document.getElementById("powerFill");
const powerText = document.getElementById("powerText");
const instructions = document.getElementById("instructions");

const LOGICAL_W = 1100;
const LOGICAL_H = 550;

const LEFT   = 68;
const RIGHT  = 1032;
const TOP    = 58;
const BOTTOM = 492;

const BALL_R = 18;
const POCKET_R = 29;

let balls = [];

let aimAngle = 0;
let lockedAngle = 0;

let mouse = {x:350,y:275};

let charging = false;
let dragStart = null;
let pull = 0;

const MAX_PULL = 145;

let ballsMoving = false;
let scratchPending = false;

let lastTime = performance.now();
let accumulator = 0;

const FIXED_STEP = 1 / 120;


/* =========================================================
   PUBLIC
   ========================================================= */

const crowd = document.getElementById("crowd");

for(let i=0;i<36;i++){

  const p=document.createElement("div");
  p.className="person";

  p.style.left=(1+i*2.8)+"%";
  p.style.height=(68+Math.random()*32)+"px";
  p.style.opacity=(.35+Math.random()*.5);
  p.style.animationDelay=(-Math.random()*3)+"s";
  p.style.animationDuration=(2.4+Math.random()*2)+"s";

  crowd.appendChild(p);
}


/* =========================================================
   AUDIO
   ========================================================= */

let audioContext=null;

let masterGain=null;
let musicGain=null;
let effectsGain=null;

let musicEnabled=true;
let effectsEnabled=true;

let musicRunning=false;
let musicTimer=null;
let beat=0;

function ensureAudio(){

  if(!audioContext){

    audioContext=
      new (window.AudioContext || window.webkitAudioContext)();

    masterGain=audioContext.createGain();
    musicGain=audioContext.createGain();
    effectsGain=audioContext.createGain();

    /*
       Musique volontairement beaucoup plus présente
       que dans la version précédente.
    */

    masterGain.gain.value=.95;
    musicGain.gain.value=.58;
    effectsGain.gain.value=.9;

    musicGain.connect(masterGain);
    effectsGain.connect(masterGain);
    masterGain.connect(audioContext.destination);
  }

  if(audioContext.state==="suspended"){
    audioContext.resume();
  }

  if(musicEnabled && !musicRunning){
    startMusic();
  }
}


function tone(freq,duration,volume,type="sine",destination=effectsGain,delay=0,endFreq=null){

  if(!audioContext || !destination)return;

  const now=audioContext.currentTime+delay;

  const osc=audioContext.createOscillator();
  const gain=audioContext.createGain();

  osc.type=type;

  osc.frequency.setValueAtTime(freq,now);

  if(endFreq){
    osc.frequency.exponentialRampToValueAtTime(
      Math.max(20,endFreq),
      now+duration
    );
  }

  gain.gain.setValueAtTime(.0001,now);
  gain.gain.exponentialRampToValueAtTime(
    Math.max(.001,volume),
    now+.015
  );

  gain.gain.exponentialRampToValueAtTime(
    .0001,
    now+duration
  );

  osc.connect(gain);
  gain.connect(destination);

  osc.start(now);
  osc.stop(now+duration+.04);
}


function audioNoise(duration,volume,cutoff){

  if(!audioContext || !effectsEnabled)return;

  const length=
    Math.floor(audioContext.sampleRate*duration);

  const buffer=
    audioContext.createBuffer(
      1,
      length,
      audioContext.sampleRate
    );

  const data=buffer.getChannelData(0);

  for(let i=0;i<length;i++){
    data[i]=(Math.random()*2-1)*
      Math.pow(1-i/length,2);
  }

  const source=audioContext.createBufferSource();
  const filter=audioContext.createBiquadFilter();
  const gain=audioContext.createGain();

  source.buffer=buffer;

  filter.type="lowpass";
  filter.frequency.value=cutoff;

  gain.gain.value=volume;

  source.connect(filter);
  filter.connect(gain);
  gain.connect(effectsGain);

  source.start();
}


/* ---------- musique lounge originale ---------- */

const bassNotes=[
  55,
  65.41,
  73.42,
  65.41,
  49,
  55,
  65.41,
  73.42
];

const chordNotes=[
  [220,261.63,329.63],
  [196,246.94,293.66],
  [174.61,220,261.63],
  [196,246.94,293.66]
];


function playBeat(){

  if(!audioContext || !musicEnabled)return;

  const s=beat%8;

  tone(
    bassNotes[s],
    .38,
    .13,
    "triangle",
    musicGain
  );

  if(s%2===0){

    const chord=
      chordNotes[(s/2)%chordNotes.length];

    chord.forEach((f,i)=>{

      tone(
        f,
        .75,
        .035,
        "sine",
        musicGain,
        i*.015
      );

      tone(
        f*2,
        .45,
        .012,
        "triangle",
        musicGain,
        i*.015
      );
    });
  }

  /* percussion douce */

  if(s===0 || s===4){

    tone(
      95,
      .10,
      .13,
      "sine",
      musicGain,
      0,
      45
    );
  }

  if(s===2 || s===6){

    tone(
      620,
      .025,
      .022,
      "triangle",
      musicGain
    );
  }

  beat++;
}


function startMusic(){

  if(musicRunning)return;

  musicRunning=true;

  playBeat();

  musicTimer=setInterval(
    playBeat,
    440
  );
}


function stopMusic(){

  if(musicTimer){
    clearInterval(musicTimer);
  }

  musicTimer=null;
  musicRunning=false;
}


function soundCue(power){

  if(!effectsEnabled)return;

  tone(
    260,
    .045,
    .55,
    "triangle",
    effectsGain,
    0,
    125
  );

  tone(
    95,
    .075,
    .38,
    "sine",
    effectsGain
  );

  audioNoise(
    .028,
    .13,
    1500
  );
}


let lastCollisionSound=0;

function soundBall(impact){

  if(!effectsEnabled)return;

  const now=performance.now();

  if(now-lastCollisionSound<15)return;

  lastCollisionSound=now;

  const volume=
    Math.min(.55,.12+impact*.015);

  tone(
    390,
    .038,
    volume,
    "triangle",
    effectsGain,
    0,
    210
  );
}


function soundRail(impact){

  if(!effectsEnabled)return;

  const volume=
    Math.min(.45,.12+impact*.012);

  tone(
    125,
    .055,
    volume,
    "triangle",
    effectsGain,
    0,
    75
  );
}


function soundPocket(){

  if(!effectsEnabled)return;

  tone(
    165,
    .17,
    .58,
    "sine",
    effectsGain,
    0,
    60
  );

  tone(
    75,
    .25,
    .4,
    "triangle",
    effectsGain,
    .02,
    38
  );
}


document.getElementById("musicButton").onclick=()=>{

  ensureAudio();

  musicEnabled=!musicEnabled;

  if(musicEnabled){

    musicGain.gain.value=.58;
    startMusic();

    document.getElementById("musicButton")
      .textContent="♫ MUSIQUE";

  }else{

    musicGain.gain.value=0;
    stopMusic();

    document.getElementById("musicButton")
      .textContent="♫ COUPÉE";
  }
};


document.getElementById("soundButton").onclick=()=>{

  ensureAudio();

  effectsEnabled=!effectsEnabled;

  effectsGain.gain.value=
    effectsEnabled ? .9 : 0;

  document.getElementById("soundButton")
    .textContent=
      effectsEnabled ? "🔊 SON" : "🔇 SON";
};


/* =========================================================
   CANVAS
   ========================================================= */

function resizeCanvas(){

  const rect=canvas.getBoundingClientRect();

  const dpr=
    Math.min(window.devicePixelRatio || 1,2);

  canvas.width=
    Math.round(rect.width*dpr);

  canvas.height=
    Math.round(rect.height*dpr);

  ctx.setTransform(
    canvas.width/LOGICAL_W,
    0,
    0,
    canvas.height/LOGICAL_H,
    0,
    0
  );
}

window.addEventListener(
  "resize",
  resizeCanvas
);


/* =========================================================
   BILLES
   ========================================================= */

const COLORS={
  1:"#f2d225",
  2:"#2870d8",
  3:"#df3037",
  4:"#8a3ab1",
  5:"#ef811d",
  6:"#15905a",
  7:"#8e2631",
  8:"#111318",

  9:"#f2d225",
  10:"#2870d8",
  11:"#df3037",
  12:"#8a3ab1",
  13:"#ef811d",
  14:"#15905a",
  15:"#8e2631"
};


class Ball{

  constructor(number,x,y){

    this.number=number;

    this.x=x;
    this.y=y;

    this.vx=0;
    this.vy=0;

    this.pocketed=false;
  }

  speed(){
    return Math.hypot(
      this.vx,
      this.vy
    );
  }
}


function cueBall(){
  return balls[0];
}


function newGame(){

  balls=[];

  ballsMoving=false;
  charging=false;
  scratchPending=false;

  pull=0;

  balls.push(
    new Ball(
      0,
      310,
      LOGICAL_H/2
    )
  );

  /*
      Triangle réglementaire visuellement propre.
      La 8 reste au centre du rack.
  */

  const rack=[
    [1],
    [9,2],
    [3,8,10],
    [11,4,12,5],
    [6,13,7,14,15]
  ];

  const startX=760;

  const dx=BALL_R*1.78;
  const dy=BALL_R*2.04;

  rack.forEach((row,column)=>{

    row.forEach((number,index)=>{

      balls.push(
        new Ball(
          number,
          startX+column*dx,
          LOGICAL_H/2+
          (index-(row.length-1)/2)*dy
        )
      );
    });
  });

  aimAngle=0;
  lockedAngle=0;

  pull=0;
  updatePower();

  instructions.textContent=
    "Déplace la souris pour viser • Maintiens et recule la queue • Relâche pour tirer";
}


document.getElementById("newButton")
  .onclick=()=>{

    ensureAudio();
    newGame();
  };


/* =========================================================
   POCHES
   ========================================================= */

function getPockets(){

  return[
    {x:LEFT,y:TOP},
    {x:(LEFT+RIGHT)/2,y:TOP-2},
    {x:RIGHT,y:TOP},

    {x:LEFT,y:BOTTOM},
    {x:(LEFT+RIGHT)/2,y:BOTTOM+2},
    {x:RIGHT,y:BOTTOM}
  ];
}


/* =========================================================
   PHYSIQUE
   ========================================================= */

function allStopped(){

  return balls.every(
    b=>
      b.pocketed ||
      b.speed()<.04
  );
}


function checkPocket(ball){

  for(const p of getPockets()){

    const d=
      Math.hypot(
        ball.x-p.x,
        ball.y-p.y
      );

    if(d<POCKET_R){

      ball.pocketed=true;
      ball.vx=0;
      ball.vy=0;

      soundPocket();

      if(ball.number===0){
        scratchPending=true;
      }

      return true;
    }
  }

  return false;
}


function cushions(ball){

  let impact=0;

  if(ball.x-BALL_R<LEFT){

    impact=Math.abs(ball.vx);

    ball.x=LEFT+BALL_R;
    ball.vx=Math.abs(ball.vx)*.91;
  }

  if(ball.x+BALL_R>RIGHT){

    impact=Math.max(
      impact,
      Math.abs(ball.vx)
    );

    ball.x=RIGHT-BALL_R;
    ball.vx=-Math.abs(ball.vx)*.91;
  }

  if(ball.y-BALL_R<TOP){

    impact=Math.max(
      impact,
      Math.abs(ball.vy)
    );

    ball.y=TOP+BALL_R;
    ball.vy=Math.abs(ball.vy)*.91;
  }

  if(ball.y+BALL_R>BOTTOM){

    impact=Math.max(
      impact,
      Math.abs(ball.vy)
    );

    ball.y=BOTTOM-BALL_R;
    ball.vy=-Math.abs(ball.vy)*.91;
  }

  if(impact>.8){
    soundRail(impact);
  }
}


function collide(a,b){

  let dx=b.x-a.x;
  let dy=b.y-a.y;

  let distance=
    Math.hypot(dx,dy);

  if(distance===0){

    dx=.01;
    distance=.01;
  }

  const minimum=
    BALL_R*2;

  if(distance>=minimum)return;

  const nx=dx/distance;
  const ny=dy/distance;

  /*
      Séparation avant calcul de collision.
      Évite les billes qui se superposent.
  */

  const overlap=
    minimum-distance;

  a.x-=nx*overlap*.5;
  a.y-=ny*overlap*.5;

  b.x+=nx*overlap*.5;
  b.y+=ny*overlap*.5;


  const rvx=
    b.vx-a.vx;

  const rvy=
    b.vy-a.vy;

  const velocityAlongNormal=
    rvx*nx+rvy*ny;

  if(velocityAlongNormal>0)return;

  const restitution=.965;

  const impulse=
    -(1+restitution)*
    velocityAlongNormal/2;

  a.vx-=impulse*nx;
  a.vy-=impulse*ny;

  b.vx+=impulse*nx;
  b.vy+=impulse*ny;

  if(
    Math.abs(velocityAlongNormal)>.55
  ){
    soundBall(
      Math.abs(
        velocityAlongNormal
      )
    );
  }
}


function physicsStep(dt){

  const frameScale=
    dt*120;

  for(const b of balls){

    if(b.pocketed)continue;

    b.x+=b.vx*frameScale;
    b.y+=b.vy*frameScale;

    const friction=
      Math.pow(.991,frameScale);

    b.vx*=friction;
    b.vy*=friction;

    if(Math.abs(b.vx)<.04){
      b.vx=0;
    }

    if(Math.abs(b.vy)<.04){
      b.vy=0;
    }

    if(!checkPocket(b)){
      cushions(b);
    }
  }


  for(let i=0;i<balls.length;i++){

    const a=balls[i];

    if(a.pocketed)continue;

    for(
      let j=i+1;
      j<balls.length;
      j++
    ){

      const b=balls[j];

      if(b.pocketed)continue;

      collide(a,b);
    }
  }


  if(
    ballsMoving &&
    allStopped()
  ){

    ballsMoving=false;

    if(scratchPending){

      const white=cueBall();

      white.pocketed=false;
      white.x=310;
      white.y=LOGICAL_H/2;

      white.vx=0;
      white.vy=0;

      scratchPending=false;
    }

    instructions.textContent=
      "Déplace la souris pour viser";
  }
}


/* =========================================================
   SOURIS
   ========================================================= */

function mousePosition(event){

  const rect=
    canvas.getBoundingClientRect();

  return{
    x:
      (event.clientX-rect.left)/
      rect.width*LOGICAL_W,

    y:
      (event.clientY-rect.top)/
      rect.height*LOGICAL_H
  };
}


canvas.addEventListener(
  "pointermove",
  event=>{

    if(
      ballsMoving ||
      !allStopped()
    )return;

    const p=
      mousePosition(event);

    mouse=p;

    const white=cueBall();

    if(!charging){

      /*
         La queue tourne autour de la blanche.
      */

      aimAngle=
        Math.atan2(
          p.y-white.y,
          p.x-white.x
        );

    }else{

      /*
         Une fois le recul commencé,
         l'angle est VERROUILLÉ.

         Le mouvement arrière de la souris
         agit directement sur le recul
         visuel de la queue.
      */

      const mx=
        p.x-dragStart.x;

      const my=
        p.y-dragStart.y;

      const backwardsX=
        -Math.cos(lockedAngle);

      const backwardsY=
        -Math.sin(lockedAngle);

      const projected=
        mx*backwardsX+
        my*backwardsY;

      pull=
        Math.max(
          0,
          Math.min(
            MAX_PULL,
            projected
          )
        );

      updatePower();
    }
  }
);


canvas.addEventListener(
  "pointerdown",
  event=>{

    ensureAudio();

    if(
      ballsMoving ||
      !allStopped()
    )return;

    charging=true;

    lockedAngle=aimAngle;

    dragStart=
      mousePosition(event);

    pull=0;

    updatePower();

    canvas.setPointerCapture(
      event.pointerId
    );

    instructions.textContent=
      "Maintiens le clic et recule la queue";
  }
);


canvas.addEventListener(
  "pointerup",
  event=>{

    if(!charging)return;

    charging=false;

    if(pull<8){

      pull=0;
      updatePower();

      instructions.textContent=
        "Recule la queue davantage pour tirer";

      return;
    }

    fireShot();
  }
);


canvas.addEventListener(
  "pointercancel",
  ()=>{

    charging=false;
    pull=0;
    updatePower();
  }
);


function updatePower(){

  const percentage=
    Math.round(
      pull/MAX_PULL*100
    );

  powerFill.style.width=
    percentage+"%";

  powerText.textContent=
    percentage+" %";
}


function fireShot(){

  const white=cueBall();

  const power=
    pull/MAX_PULL;

  /*
     Puissance du tir.
  */

  const velocity=
    7+power*30;

  white.vx=
    Math.cos(lockedAngle)*
    velocity;

  white.vy=
    Math.sin(lockedAngle)*
    velocity;

  soundCue(power);

  aimAngle=lockedAngle;

  pull=0;
  updatePower();

  ballsMoving=true;

  instructions.textContent=
    "Billes en mouvement…";
}


/* =========================================================
   DESSIN DE LA TABLE
   Rails volontairement DROITS.
   Aucun bord ondulé.
   ========================================================= */

function drawTable(){

  ctx.clearRect(
    0,0,
    LOGICAL_W,
    LOGICAL_H
  );

  /*
     tapis
  */

  const felt=
    ctx.createRadialGradient(
      540,220,20,
      550,275,620
    );

  felt.addColorStop(
    0,
    "#18a973"
  );

  felt.addColorStop(
    .55,
    "#07865c"
  );

  felt.addColorStop(
    1,
    "#03563b"
  );

  ctx.fillStyle=felt;

  ctx.fillRect(
    LEFT,
    TOP,
    RIGHT-LEFT,
    BOTTOM-TOP
  );


  /*
     bandes intérieures :
     4 rectangles parfaitement droits
  */

  const railGradient=
    ctx.createLinearGradient(
      0,TOP-28,0,TOP
    );

  railGradient.addColorStop(
    0,
    "#116f4e"
  );

  railGradient.addColorStop(
    1,
    "#064b35"
  );

  ctx.fillStyle=railGradient;

  ctx.fillRect(
    LEFT,
    TOP-20,
    RIGHT-LEFT,
    20
  );

  ctx.fillRect(
    LEFT,
    BOTTOM,
    RIGHT-LEFT,
    20
  );

  ctx.fillRect(
    LEFT-20,
    TOP,
    20,
    BOTTOM-TOP
  );

  ctx.fillRect(
    RIGHT,
    TOP,
    20,
    BOTTOM-TOP
  );


  /*
     repères losanges
  */

  ctx.fillStyle=
    "rgba(235,225,198,.8)";

  for(let i=1;i<8;i++){

    const x=
      LEFT+
      (RIGHT-LEFT)*i/8;

    drawDiamond(
      x,
      TOP-30
    );

    drawDiamond(
      x,
      BOTTOM+30
    );
  }


  for(let i=1;i<4;i++){

    const y=
      TOP+
      (BOTTOM-TOP)*i/4;

    drawDiamond(
      LEFT-30,
      y
    );

    drawDiamond(
      RIGHT+30,
      y
    );
  }


  /*
     poches
  */

  for(const p of getPockets()){

    ctx.save();

    ctx.shadowColor=
      "rgba(0,0,0,.9)";

    ctx.shadowBlur=14;

    const pg=
      ctx.createRadialGradient(
        p.x-5,
        p.y-6,
        2,
        p.x,
        p.y,
        POCKET_R+7
      );

    pg.addColorStop(
      0,
      "#000"
    );

    pg.addColorStop(
      .75,
      "#000"
    );

    pg.addColorStop(
      1,
      "#1c211f"
    );

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      POCKET_R+5,
      0,
      Math.PI*2
    );

    ctx.fillStyle=pg;
    ctx.fill();

    ctx.restore();
  }
}


function drawDiamond(x,y){

  ctx.save();

  ctx.translate(x,y);
  ctx.rotate(Math.PI/4);

  ctx.fillRect(
    -4,-4,
    8,8
  );

  ctx.restore();
}


/* =========================================================
   BILLES BRILLANTES
   ========================================================= */

function drawBall(ball){

  if(ball.pocketed)return;

  ctx.save();

  ctx.shadowColor=
    "rgba(0,0,0,.65)";

  ctx.shadowBlur=10;

  ctx.shadowOffsetX=5;
  ctx.shadowOffsetY=7;


  const base=
    ball.number===0
      ? "#f5f6f3"
      : COLORS[ball.number];


  const gradient=
    ctx.createRadialGradient(
      ball.x-BALL_R*.45,
      ball.y-BALL_R*.5,
      1,

      ball.x,
      ball.y,
      BALL_R*1.15
    );

  gradient.addColorStop(
    0,
    "#ffffff"
  );

  gradient.addColorStop(
    .2,
    base
  );

  gradient.addColorStop(
    .72,
    base
  );

  gradient.addColorStop(
    1,
    "#05070a"
  );


  ctx.beginPath();

  ctx.arc(
    ball.x,
    ball.y,
    BALL_R,
    0,
    Math.PI*2
  );

  ctx.fillStyle=gradient;
  ctx.fill();

  ctx.shadowColor="transparent";


  /*
     bandes blanches
     billes rayées
  */

  if(ball.number>=9){

    ctx.save();

    ctx.beginPath();

    ctx.arc(
      ball.x,
      ball.y,
      BALL_R-.5,
      0,
      Math.PI*2
    );

    ctx.clip();

    ctx.fillStyle="#f6f4ed";

    ctx.fillRect(
      ball.x-BALL_R,
      ball.y-7,
      BALL_R*2,
      14
    );

    ctx.restore();
  }


  /*
     numéro
  */

  if(ball.number!==0){

    ctx.beginPath();

    ctx.arc(
      ball.x,
      ball.y,
      8.5,
      0,
      Math.PI*2
    );

    ctx.fillStyle="#faf9f3";
    ctx.fill();

    ctx.fillStyle="#111";

    ctx.font=
      "bold 10px Arial";

    ctx.textAlign="center";
    ctx.textBaseline="middle";

    ctx.fillText(
      ball.number,
      ball.x,
      ball.y+.3
    );
  }


  /*
     reflet brillant
  */

  ctx.beginPath();

  ctx.ellipse(
    ball.x-BALL_R*.38,
    ball.y-BALL_R*.47,
    BALL_R*.28,
    BALL_R*.14,
    -.55,
    0,
    Math.PI*2
  );

  ctx.fillStyle=
    "rgba(255,255,255,.72)";

  ctx.fill();

  ctx.restore();
}


/* =========================================================
   CALCUL DU GUIDE DE VISÉE
   ========================================================= */

function calculateAim(){

  const white=cueBall();

  if(
    white.pocketed ||
    ballsMoving
  )return null;

  const angle=
    charging
      ? lockedAngle
      : aimAngle;

  const dx=Math.cos(angle);
  const dy=Math.sin(angle);

  let closest=null;
  let closestDistance=Infinity;


  /*
     Recherche de la première bille
     que la blanche toucherait.
  */

  for(const target of balls){

    if(
      target===white ||
      target.pocketed
    )continue;

    const ox=
      target.x-white.x;

    const oy=
      target.y-white.y;

    const projection=
      ox*dx+oy*dy;

    if(projection<=0)continue;

    const perpendicularSq=
      ox*ox+
      oy*oy-
      projection*projection;

    const collisionRadius=
      BALL_R*2;

    if(
      perpendicularSq >
      collisionRadius*
      collisionRadius
    )continue;

    const offset=
      Math.sqrt(
        collisionRadius*
        collisionRadius-
        perpendicularSq
      );

    const distance=
      projection-offset;

    if(
      distance>0 &&
      distance<closestDistance
    ){

      closestDistance=distance;
      closest=target;
    }
  }


  /*
     Si aucune bille n'est visée :
     le guide s'arrête sur une bande.
  */

  if(!closest){

    let wallDistance=Infinity;

    if(dx>0){
      wallDistance=Math.min(
        wallDistance,
        (RIGHT-BALL_R-white.x)/dx
      );
    }

    if(dx<0){
      wallDistance=Math.min(
        wallDistance,
        (LEFT+BALL_R-white.x)/dx
      );
    }

    if(dy>0){
      wallDistance=Math.min(
        wallDistance,
        (BOTTOM-BALL_R-white.y)/dy
      );
    }

    if(dy<0){
      wallDistance=Math.min(
        wallDistance,
        (TOP+BALL_R-white.y)/dy
      );
    }

    return{
      target:null,

      ghostX:
        white.x+
        dx*wallDistance,

      ghostY:
        white.y+
        dy*wallDistance,

      dx,dy
    };
  }


  return{
    target:closest,

    ghostX:
      white.x+
      dx*closestDistance,

    ghostY:
      white.y+
      dy*closestDistance,

    dx,dy
  };
}


/* =========================================================
   GUIDE BLANC TYPE BILLARD
   ========================================================= */

function drawAimGuide(){

  if(
    ballsMoving ||
    !allStopped()
  )return;

  const white=cueBall();

  if(white.pocketed)return;

  const result=
    calculateAim();

  if(!result)return;


  ctx.save();

  /*
     LIGNE BLANCHE PRINCIPALE
     de la blanche vers le point d'impact.
  */

  ctx.strokeStyle=
    "rgba(255,255,255,.94)";

  ctx.lineWidth=2.2;

  ctx.beginPath();

  ctx.moveTo(
    white.x,
    white.y
  );

  ctx.lineTo(
    result.ghostX,
    result.ghostY
  );

  ctx.stroke();


  /*
     Cercle fantôme :
     position de la bille blanche
     au moment de l'impact.
  */

  ctx.beginPath();

  ctx.arc(
    result.ghostX,
    result.ghostY,
    BALL_R,
    0,
    Math.PI*2
  );

  ctx.strokeStyle="#fff";
  ctx.lineWidth=2.6;
  ctx.stroke();


  /*
     petit point central
  */

  ctx.beginPath();

  ctx.arc(
    result.ghostX,
    result.ghostY,
    3.3,
    0,
    Math.PI*2
  );

  ctx.fillStyle="#fff";
  ctx.fill();


  /*
     Si une bille est touchée :
     trajectoire prévue de la bille cible.
  */

  if(result.target){

    const target=result.target;

    let tx=
      target.x-result.ghostX;

    let ty=
      target.y-result.ghostY;

    const length=
      Math.hypot(tx,ty);

    if(length>0){

      tx/=length;
      ty/=length;

      const predictionLength=100;

      ctx.beginPath();

      ctx.moveTo(
        target.x,
        target.y
      );

      ctx.lineTo(
        target.x+
        tx*predictionLength,

        target.y+
        ty*predictionLength
      );

      ctx.strokeStyle=
        "rgba(255,255,255,.92)";

      ctx.lineWidth=2;
      ctx.stroke();


      /*
         petite flèche de direction
      */

      const endX=
        target.x+
        tx*predictionLength;

      const endY=
        target.y+
        ty*predictionLength;

      ctx.beginPath();

      ctx.arc(
        endX,
        endY,
        4,
        0,
        Math.PI*2
      );

      ctx.fillStyle="#fff";
      ctx.fill();
    }
  }

  ctx.restore();
}


/* =========================================================
   QUEUE
   ========================================================= */

function drawCue(){

  if(
    ballsMoving ||
    !allStopped()
  )return;

  const white=cueBall();

  if(white.pocketed)return;

  const angle=
    charging
      ? lockedAngle
      : aimAngle;

  const dx=Math.cos(angle);
  const dy=Math.sin(angle);


  /*
     La queue est TOUJOURS dans l'axe
     opposé à la trajectoire du tir.

     Lorsqu'on tire la souris en arrière,
     "pull" augmente et la queue recule
     visiblement.
  */

  const baseGap=
    BALL_R+9;

  const gap=
    baseGap+pull;

  const cueLength=360;

  const tipX=
    white.x-
    dx*gap;

  const tipY=
    white.y-
    dy*gap;

  const backX=
    white.x-
    dx*(gap+cueLength);

  const backY=
    white.y-
    dy*(gap+cueLength);


  ctx.save();

  ctx.lineCap="round";


  /*
     ombre
  */

  ctx.strokeStyle=
    "rgba(0,0,0,.55)";

  ctx.lineWidth=11;

  ctx.beginPath();

  ctx.moveTo(
    tipX+4,
    tipY+5
  );

  ctx.lineTo(
    backX+4,
    backY+5
  );

  ctx.stroke();


  /*
     bois
  */

  const wood=
    ctx.createLinearGradient(
      tipX,
      tipY,
      backX,
      backY
    );

  wood.addColorStop(
    0,
    "#f0d7a4"
  );

  wood.addColorStop(
    .35,
    "#d69b55"
  );

  wood.addColorStop(
    .7,
    "#81401f"
  );

  wood.addColorStop(
    1,
    "#281008"
  );

  ctx.strokeStyle=wood;
  ctx.lineWidth=8;

  ctx.beginPath();

  ctx.moveTo(
    tipX,
    tipY
  );

  ctx.lineTo(
    backX,
    backY
  );

  ctx.stroke();


  /*
     embout bleu
  */

  ctx.strokeStyle="#36bfff";
  ctx.lineWidth=6;

  ctx.beginPath();

  ctx.moveTo(
    tipX,
    tipY
  );

  ctx.lineTo(
    tipX-dx*7,
    tipY-dy*7
  );

  ctx.stroke();


  /*
     décoration arrière
  */

  ctx.strokeStyle="#d8ad5b";
  ctx.lineWidth=9;

  ctx.beginPath();

  ctx.moveTo(
    backX+dx*42,
    backY+dy*42
  );

  ctx.lineTo(
    backX+dx*67,
    backY+dy*67
  );

  ctx.stroke();

  ctx.restore();
}


/* =========================================================
   RENDU
   ========================================================= */

function render(){

  drawTable();

  /*
     Guide sous les billes :
     même logique visuelle que les
     jeux de billard modernes.
  */

  drawAimGuide();

  for(const ball of balls){
    drawBall(ball);
  }

  /*
     Queue au-dessus du tapis.
  */

  drawCue();
}


/* =========================================================
   BOUCLE STABLE
   ========================================================= */

function gameLoop(now){

  const delta=
    Math.min(
      .03,
      (now-lastTime)/1000
    );

  lastTime=now;

  accumulator+=delta;


  while(
    accumulator>=FIXED_STEP
  ){

    physicsStep(
      FIXED_STEP
    );

    accumulator-=
      FIXED_STEP;
  }


  render();

  requestAnimationFrame(
    gameLoop
  );
}


/* =========================================================
   INITIALISATION
   ========================================================= */

resizeCanvas();
newGame();

requestAnimationFrame(
  gameLoop
);


/*
   Chrome bloque la musique automatique
   avant la première interaction.

   Dès le premier clic dans la page,
   le moteur audio démarre.
*/

document.addEventListener(
  "pointerdown",
  ensureAudio,
  {once:true}
);

</script>
