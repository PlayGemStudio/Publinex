<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{

}

/* ambiance sobre : pas de faux bar / plage / silhouettes */
body:before{
  content:"";

  inset:0;
  pointer-events:none;
  background:
    linear-gradient(90deg,rgba(0,0,0,.58),transparent 18%,transparent 82%,rgba(0,0,0,.58)),

/* ---------- HUD ---------- */
.topbar{

.player.right{justify-content:flex-end;text-align:right}

.logo{text-align:center}

/* ---------- JEU ---------- */
.gameWrap{
  position:absolute;
  top:130px;
  bottom:76px;
  left:50%;
  transform:translateX(-50%);

  display:flex;
  align-items:center;
  justify-content:center;
}

.tableShell{
  position:relative;
  width:100%;
  aspect-ratio:2/1;
  padding:31px;
  border-radius:30px;

  /* bois plus travaillé */
  background:
    linear-gradient(90deg,transparent 0 3%,rgba(255,255,255,.07) 4%,transparent 7% 93%,rgba(255,255,255,.05) 96%,transparent),
    repeating-linear-gradient(3deg,#4c1d0e 0 5px,#632817 6px 10px,#3b160b 11px 14px);
  border:4px solid #261007;
  box-shadow:
    0 35px 70px #000d,
    0 0 0 3px #8e542e,
    inset 0 0 0 4px #1c0905,
    inset 0 0 25px #000b;
}

/* pièces métalliques discrètes */
.corner{
  position:absolute;width:46px;height:46px;
  background:radial-gradient(circle at 35% 30%,#d5a86b,#725027 45%,#24170d 76%);
  z-index:2;
  filter:drop-shadow(0 3px 4px #000);
}
.c1{left:8px;top:8px;border-radius:22px 6px 18px 6px}
.c2{right:8px;top:8px;border-radius:6px 22px 6px 18px}
.c3{left:8px;bottom:8px;border-radius:6px 18px 6px 22px}
.c4{right:8px;bottom:8px;border-radius:18px 6px 22px 6px}

canvas{
  position:relative;
  z-index:3;
  display:block;
  width:100%;
  height:100%;
  border-radius:7px;
  cursor:crosshair;
}

/* ---------- CONTROLES ---------- */
.controls{
  position:absolute;
  z-index:6;
  bottom:15px;
  left:50%;
  transform:translateX(-50%);
  width:min(1050px,78vw);
  height:52px;
  display:flex;
  align-items:center;
  gap:15px;
  padding:0 20px;
  border:1px solid #35465a;
  border-radius:18px;
  background:linear-gradient(#111b27,#080d13);
  box-shadow:0 12px 30px #000a;
}
.controls b{font-size:13px;letter-spacing:.6px}
.power{
  flex:1;height:13px;border-radius:10px;
  overflow:hidden;
  border:1px solid #52647a;

}
.powerFill{
  height:100%;width:0%;

  box-shadow:0 0 12px #38e47d;
}
.help{font-size:12px;color:#b9c6d4;white-space:nowrap}

.buttons{
  position:absolute;
  right:22px;
  top:122px;
  z-index:8;
  display:flex;gap:7px;
}
button{
  border:1px solid #476079;
  background:linear-gradient(#17314a,#0b1a29);
  color:#fff;
  border-radius:10px;
  padding:10px 13px;
  font-weight:800;

}
button:hover{filter:brightness(1.18)}

@media(max-width:900px){
  .topbar{width:96vw;grid-template-columns:1fr 160px 1fr}
  .gameWrap,.controls{width:94vw}
  .gameWrap{top:135px}
  .player{padding:0 10px}
  .logo strong{font-size:20px}
  .avatar{width:44px;height:44px}
  .ballSlots,.state{display:none}
}
</style>

<body>

<div class="topbar">
  <div class="player">
    <div class="avatar p1">J1</div>
    <div>
      <div class="name">Joueur 1</div>

        <i class="slot"></i><i class="slot"></i><i class="slot"></i>

<div class="gameWrap">
  <div class="tableShell">
    <span class="corner c1"></span>
    <span class="corner c2"></span>
    <span class="corner c3"></span>

    <canvas id="game" width="1200" height="600"></canvas>

</div>

<div class="controls">
  <b>PUISSANCE</b>
  <div class="power"><div class="powerFill" id="powerFill"></div></div>
  <div class="help">Vise • maintiens • tire la queue en arrière • relâche</div>
</div>

<script>
"use strict";

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const powerFill=document.getElementById("powerFill");
const soundBtn=document.getElementById("soundBtn");

const W=1200,H=600;
const BALL_R=15;
const LEFT=70,RIGHT=1130,TOP=65,BOTTOM=535;
const POCKET_R=28;

const pockets=[
  {x:LEFT,y:TOP,type:"corner"},
  {x:600,y:TOP,type:"middle"},
  {x:RIGHT,y:TOP,type:"corner"},
  {x:LEFT,y:BOTTOM,type:"corner"},
  {x:600,y:BOTTOM,type:"middle"},
  {x:RIGHT,y:BOTTOM,type:"corner"}
];

let balls=[];
let aimAngle=0;
let charging=false;
let pull=0;
let ballsMoving=false;
let soundOn=true;
let audioCtx=null;
let lastTime=performance.now();
let accumulator=0;

const STEP=1/120;

/* =========================================================
   AUDIO : uniquement effets propres, PAS de fausse musique
   ========================================================= */
function initAudio(){
  if(!audioCtx){
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  }
  if(audioCtx.state==="suspended") audioCtx.resume();
}

function tone(freq,duration,volume,type="sine"){
  if(!soundOn)return;
  initAudio();

  const o=audioCtx.createOscillator();
  const g=audioCtx.createGain();
  o.type=type;
  o.frequency.value=freq;

  g.gain.setValueAtTime(volume,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);

  o.connect(g);
  g.connect(audioCtx.destination);
  o.start();
  o.stop(audioCtx.currentTime+duration);
}

function cueSound(power){
  tone(110+power*1.3,.07,.12,"triangle");
}

function ballSound(speed){
  tone(320+Math.min(speed,300),.025,Math.min(.045+speed/8000,.11),"sine");
}

function railSound(){
  tone(150,.035,.045,"triangle");
}

function pocketSound(){
  tone(95,.16,.12,"sine");
  setTimeout(()=>tone(70,.20,.08,"sine"),45);
}

/* =========================================================
   BILLES
   ========================================================= */
const colors={
  1:"#f1d21a",2:"#176acb",3:"#d92e31",4:"#7139a8",
  5:"#e77b1b",6:"#22844b",7:"#7e2426",8:"#111111",
  9:"#f1d21a",10:"#176acb",11:"#d92e31",12:"#7139a8",
  13:"#e77b1b",14:"#22844b",15:"#7e2426"
};

class Ball{
  constructor(x,y,n){
    this.x=x;this.y=y;
    this.vx=0;this.vy=0;
    this.n=n;
    this.active=true;
  }

  draw(){
    if(!this.active)return;

    ctx.save();

    ctx.shadowColor="rgba(0,0,0,.65)";
    ctx.shadowBlur=8;
    ctx.shadowOffsetX=5;
    ctx.shadowOffsetY=6;

    const g=ctx.createRadialGradient(
      this.x-6,this.y-7,2,
      this.x,this.y,BALL_R+2
    );

    if(this.n===0){
      g.addColorStop(0,"#ffffff");
      g.addColorStop(.55,"#f7f7f3");
      g.addColorStop(1,"#aeb5b7");
    }else{
      g.addColorStop(0,"#ffffff");
      g.addColorStop(.15,colors[this.n]);
      g.addColorStop(.72,colors[this.n]);
      g.addColorStop(1,"#151515");
    }

    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.arc(this.x,this.y,BALL_R,0,Math.PI*2);
    ctx.fill();

    ctx.shadowColor="transparent";

    if(this.n>0){
      if(this.n>=9){
        ctx.save();
        ctx.beginPath();
        ctx.arc(this.x,this.y,BALL_R-1,0,Math.PI*2);
        ctx.clip();

        ctx.fillStyle="#f5f4e9";
        ctx.fillRect(this.x-BALL_R,this.y-7,BALL_R*2,14);

        ctx.restore();
      }

      ctx.fillStyle="#f7f7f2";
      ctx.beginPath();
      ctx.arc(this.x,this.y,7.3,0,Math.PI*2);
      ctx.fill();

      ctx.fillStyle="#111";
      ctx.font="bold 8px Arial";
      ctx.textAlign="center";
      ctx.textBaseline="middle";
      ctx.fillText(this.n,this.x,this.y+.5);
    }

    /* reflet */
    ctx.fillStyle="rgba(255,255,255,.65)";
    ctx.beginPath();
    ctx.ellipse(this.x-5,this.y-6,3.4,2.2,-.5,0,Math.PI*2);
    ctx.fill();

    ctx.restore();
  }
}

function resetGame(){
  balls=[];

  /* blanche à GAUCHE : orientation corrigée */
  balls.push(new Ball(325,300,0));

  const startX=835;
  const gap=BALL_R*2+1;
  let n=1;

  /* rack vers la droite */
  for(let col=0;col<5;col++){
    const x=startX+col*gap*.88;
    const y0=300-col*gap/2;

    for(let row=0;row<=col;row++){
      let num=n++;

      balls.push(new Ball(x,y0+row*gap,num));
    }
  }

  /* mettre la 8 plus au centre du triangle */
  const eight=balls.find(b=>b.n===8);
  const centerBall=balls.reduce((best,b)=>{
    if(b.n===0)return best;
    const d=Math.hypot(b.x-(startX+gap*1.7),b.y-300);
    return !best||d<best.d?{b,d}:best;
  },null);

  if(eight&&centerBall){
    const tX=eight.x,tY=eight.y;
    eight.x=centerBall.b.x;
    eight.y=centerBall.b.y;
    centerBall.b.x=tX;
    centerBall.b.y=tY;
  }

  aimAngle=0;
  charging=false;
  pull=0;
  powerFill.style.width="0%";
}

function cueBall(){
  return balls[0];
}

/* =========================================================
   TABLE
   Les poches sont des OUVERTURES dans les bandes,
   pas six cercles posés sur le tapis.
   ========================================================= */
function roundedRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.roundRect(x,y,w,h,r);
}

function drawTable(){
  ctx.clearRect(0,0,W,H);

  /* sous-couche sombre */
  ctx.fillStyle="#080a0b";
  roundedRect(20,20,W-40,H-40,18);
  ctx.fill();

  /* surface du tapis */
  const felt=ctx.createLinearGradient(0,TOP,0,BOTTOM);
  felt.addColorStop(0,"#147f82");
  felt.addColorStop(.45,"#086f72");
  felt.addColorStop(1,"#07595d");

  ctx.fillStyle=felt;
  ctx.fillRect(LEFT,TOP,RIGHT-LEFT,BOTTOM-TOP);

  /* texture FIXE mathématique, pas de Math.random = aucun scintillement */
  ctx.save();
  ctx.globalAlpha=.045;
  ctx.strokeStyle="#d9ffff";
  ctx.lineWidth=1;

  for(let y=TOP+7;y<BOTTOM;y+=13){
    const shift=(y*17)%19;
    ctx.beginPath();
    ctx.moveTo(LEFT+shift,y);
    ctx.lineTo(RIGHT,y);
    ctx.stroke();
  }
  ctx.restore();

  /* bandes en bois */
  const wood=ctx.createLinearGradient(0,0,0,70);
  wood.addColorStop(0,"#9a5531");
  wood.addColorStop(.25,"#612815");
  wood.addColorStop(.7,"#3b170d");
  wood.addColorStop(1,"#170906");

  ctx.fillStyle=wood;

  /* bandes HAUT avec coupures réelles pour les poches */
  ctx.fillRect(LEFT+28,30,500-LEFT-28,35);
  ctx.fillRect(LEFT+558,30,RIGHT-(LEFT+558)-28,35);

  /* bandes BAS */
  ctx.fillRect(LEFT+28,BOTTOM,500-LEFT-28,35);
  ctx.fillRect(LEFT+558,BOTTOM,RIGHT-(LEFT+558)-28,35);

  /* côtés */
  ctx.fillRect(35,TOP+28,35,BOTTOM-TOP-56);
  ctx.fillRect(RIGHT,TOP+28,35,BOTTOM-TOP-56);

  /* coussins */
  ctx.fillStyle="#07514e";

  ctx.beginPath();
  ctx.moveTo(LEFT+35,TOP);
  ctx.lineTo(575,TOP);
  ctx.lineTo(557,TOP+20);
  ctx.lineTo(LEFT+48,TOP+20);
  ctx.closePath();ctx.fill();

  ctx.beginPath();
  ctx.moveTo(625,TOP);
  ctx.lineTo(RIGHT-35,TOP);
  ctx.lineTo(RIGHT-48,TOP+20);
  ctx.lineTo(643,TOP+20);
  ctx.closePath();ctx.fill();

  ctx.beginPath();
  ctx.moveTo(LEFT+35,BOTTOM);
  ctx.lineTo(575,BOTTOM);
  ctx.lineTo(557,BOTTOM-20);
  ctx.lineTo(LEFT+48,BOTTOM-20);
  ctx.closePath();ctx.fill();

  ctx.beginPath();
  ctx.moveTo(625,BOTTOM);
  ctx.lineTo(RIGHT-35,BOTTOM);
  ctx.lineTo(RIGHT-48,BOTTOM-20);
  ctx.lineTo(643,BOTTOM-20);
  ctx.closePath();ctx.fill();

  ctx.beginPath();
  ctx.moveTo(LEFT,TOP+35);
  ctx.lineTo(LEFT,BOTTOM-35);
  ctx.lineTo(LEFT+20,BOTTOM-48);
  ctx.lineTo(LEFT+20,TOP+48);
  ctx.closePath();ctx.fill();

  ctx.beginPath();
  ctx.moveTo(RIGHT,TOP+35);
  ctx.lineTo(RIGHT,BOTTOM-35);
  ctx.lineTo(RIGHT-20,BOTTOM-48);
  ctx.lineTo(RIGHT-20,TOP+48);
  ctx.closePath();ctx.fill();

  /* véritables bouches de poches */
  drawPocketMouth(LEFT,TOP,"tl");
  drawPocketMouth(600,TOP,"tm");
  drawPocketMouth(RIGHT,TOP,"tr");
  drawPocketMouth(LEFT,BOTTOM,"bl");
  drawPocketMouth(600,BOTTOM,"bm");
  drawPocketMouth(RIGHT,BOTTOM,"br");

  /* repères incrustés */
  ctx.fillStyle="#d9c39a";
  const marks=[205,350,495,705,850,995];
  for(const x of marks){
    diamond(x,48);
    diamond(x,552);
  }
  diamond(52,180);diamond(52,300);diamond(52,420);
  diamond(1148,180);diamond(1148,300);diamond(1148,420);
}

function diamond(x,y){
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(Math.PI/4);
  ctx.fillRect(-3,-3,6,6);
  ctx.restore();
}

function drawPocketMouth(x,y,pos){
  ctx.save();

  /* ombre intérieure */
  const g=ctx.createRadialGradient(x,y,3,x,y,31);
  g.addColorStop(0,"#000");
  g.addColorStop(.55,"#020202");
  g.addColorStop(.76,"#15100c");
  g.addColorStop(1,"rgba(0,0,0,0)");

  ctx.fillStyle=g;

  ctx.beginPath();

  if(pos==="tl"){
    ctx.moveTo(x-4,y-4);
    ctx.arc(x,y,30,0,Math.PI/2);
    ctx.lineTo(x-4,y+4);
  }else if(pos==="tr"){
    ctx.moveTo(x+4,y-4);
    ctx.arc(x,y,30,Math.PI/2,Math.PI);
    ctx.lineTo(x+4,y+4);
  }else if(pos==="bl"){
    ctx.moveTo(x-4,y+4);
    ctx.arc(x,y,30,-Math.PI/2,0);
    ctx.lineTo(x-4,y-4);
  }else if(pos==="br"){
    ctx.moveTo(x+4,y+4);
    ctx.arc(x,y,30,Math.PI,Math.PI*1.5);
    ctx.lineTo(x+4,y-4);
  }else{
    ctx.ellipse(x,y,31,23,0,0,Math.PI*2);
  }

  ctx.fill();

  /* cuir autour de la bouche */
  ctx.strokeStyle="#3c2114";
  ctx.lineWidth=6;
  if(pos==="tm"||pos==="bm"){
    ctx.beginPath();
    ctx.arc(x,y,26,0,Math.PI*2);
    ctx.stroke();
  }

  ctx.restore();
}

/* =========================================================
   VISÉE
   ========================================================= */
function firstCollisionRay(){
  const c=cueBall();
  const dx=Math.cos(aimAngle);
  const dy=Math.sin(aimAngle);

  let best=null;
  let bestT=Infinity;

  for(let i=1;i<balls.length;i++){
    const b=balls[i];
    if(!b.active)continue;

    const ox=c.x-b.x;
    const oy=c.y-b.y;

    const B=2*(dx*ox+dy*oy);
    const C=ox*ox+oy*oy-(BALL_R*2)*(BALL_R*2);
    const disc=B*B-4*C;

    if(disc<0)continue;

    const t=(-B-Math.sqrt(disc))/2;
    if(t>0&&t<bestT){
      bestT=t;
      best=b;
    }
  }

  return best?{ball:best,t:bestT}:null;
}

function wallRayDistance(){
  const c=cueBall();
  const dx=Math.cos(aimAngle);
  const dy=Math.sin(aimAngle);
  let t=Infinity;

  if(dx>0)t=Math.min(t,(RIGHT-BALL_R-c.x)/dx);
  if(dx<0)t=Math.min(t,(LEFT+BALL_R-c.x)/dx);
  if(dy>0)t=Math.min(t,(BOTTOM-BALL_R-c.y)/dy);
  if(dy<0)t=Math.min(t,(TOP+BALL_R-c.y)/dy);

  return t;
}

function drawAim(){
  if(ballsMoving||!cueBall().active)return;

  const c=cueBall();
  const dx=Math.cos(aimAngle);
  const dy=Math.sin(aimAngle);

  const hit=firstCollisionRay();
  const wallT=wallRayDistance();
  const t=hit?Math.min(hit.t,wallT):wallT;

  const gx=c.x+dx*t;
  const gy=c.y+dy*t;

  ctx.save();

  /* trajectoire blanche continue */
  ctx.strokeStyle="rgba(255,255,255,.92)";
  ctx.lineWidth=2.2;
  ctx.beginPath();
  ctx.moveTo(c.x,c.y);
  ctx.lineTo(gx,gy);
  ctx.stroke();

  /* cercle fantôme */
  ctx.strokeStyle="rgba(255,255,255,.9)";
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.arc(gx,gy,BALL_R,0,Math.PI*2);
  ctx.stroke();

  if(hit&&hit.t<wallT){
    const target=hit.ball;

    const nx=target.x-gx;
    const ny=target.y-gy;
    const len=Math.hypot(nx,ny)||1;

    const tx=nx/len;
    const ty=ny/len;

    ctx.strokeStyle="rgba(118,225,255,.82)";
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(target.x,target.y);
    ctx.lineTo(target.x+tx*110,target.y+ty*110);
    ctx.stroke();
  }

  ctx.restore();
}

/* =========================================================
   QUEUE
   ========================================================= */
function drawCue(){
  if(ballsMoving||!cueBall().active)return;

  const c=cueBall();

  /* queue derrière la blanche */
  const backX=-Math.cos(aimAngle);
  const backY=-Math.sin(aimAngle);

  const start=BALL_R+9+pull;
  const end=start+245;

  const x1=c.x+backX*start;
  const y1=c.y+backY*start;
  const x2=c.x+backX*end;
  const y2=c.y+backY*end;

  ctx.save();

  ctx.lineCap="round";

  /* ombre */
  ctx.strokeStyle="rgba(0,0,0,.55)";
  ctx.lineWidth=10;
  ctx.beginPath();
  ctx.moveTo(x1+4,y1+5);
  ctx.lineTo(x2+4,y2+5);
  ctx.stroke();

  /* bois */
  const grad=ctx.createLinearGradient(x1,y1,x2,y2);
  grad.addColorStop(0,"#f5d18a");
  grad.addColorStop(.55,"#c47a35");
  grad.addColorStop(.82,"#5b2715");
  grad.addColorStop(1,"#171015");

  ctx.strokeStyle=grad;
  ctx.lineWidth=7;
  ctx.beginPath();
  ctx.moveTo(x1,y1);
  ctx.lineTo(x2,y2);
  ctx.stroke();

  /* embout bleu */
  ctx.strokeStyle="#42b9e9";
  ctx.lineWidth=8;
  ctx.beginPath();
  ctx.moveTo(
    c.x+backX*(BALL_R+6+pull),
    c.y+backY*(BALL_R+6+pull)
  );
  ctx.lineTo(x1,y1);
  ctx.stroke();

  ctx.restore();
}

/* =========================================================
   PHYSIQUE
   ========================================================= */
function physics(dt){
  let moving=false;

  for(const b of balls){
    if(!b.active)continue;

    b.x+=b.vx*dt;
    b.y+=b.vy*dt;

    const speed=Math.hypot(b.vx,b.vy);

    if(speed>.3){
      const drag=Math.pow(.987,dt*120);
      b.vx*=drag;
      b.vy*=drag;
    }else{
      b.vx=0;b.vy=0;
    }

    if(Math.hypot(b.vx,b.vy)>2)moving=true;

    /* poche AVANT rebond */
    let pocketed=false;

    for(const p of pockets){
      const d=Math.hypot(b.x-p.x,b.y-p.y);

      if(d<POCKET_R){
        b.active=false;
        b.vx=b.vy=0;
        pocketSound();
        pocketed=true;

        if(b.n===0){
          setTimeout(()=>{
            b.active=true;
            b.x=325;b.y=300;
            b.vx=b.vy=0;
          },700);
        }
        break;
      }
    }

    if(pocketed)continue;

    /* rails avec ouvertures */
    const nearTopPocket=
      Math.abs(b.x-LEFT)<42||
      Math.abs(b.x-600)<39||
      Math.abs(b.x-RIGHT)<42;

    if(b.y-BALL_R<TOP&&!nearTopPocket){
      b.y=TOP+BALL_R;
      b.vy=Math.abs(b.vy)*.88;
      railSound();
    }

    if(b.y+BALL_R>BOTTOM&&!nearTopPocket){
      b.y=BOTTOM-BALL_R;
      b.vy=-Math.abs(b.vy)*.88;
      railSound();
    }

    const nearSidePocket=
      Math.abs(b.y-TOP)<42||
      Math.abs(b.y-BOTTOM)<42;

    if(b.x-BALL_R<LEFT&&!nearSidePocket){
      b.x=LEFT+BALL_R;
      b.vx=Math.abs(b.vx)*.88;
      railSound();
    }

    if(b.x+BALL_R>RIGHT&&!nearSidePocket){
      b.x=RIGHT-BALL_R;
      b.vx=-Math.abs(b.vx)*.88;
      railSound();
    }
  }

  /* collisions bille/bille */
  for(let i=0;i<balls.length;i++){
    const a=balls[i];
    if(!a.active)continue;

    for(let j=i+1;j<balls.length;j++){
      const b=balls[j];
      if(!b.active)continue;

      let dx=b.x-a.x;
      let dy=b.y-a.y;
      let dist=Math.hypot(dx,dy);
      const min=BALL_R*2;

      if(dist>0&&dist<min){
        const nx=dx/dist;
        const ny=dy/dist;

        const overlap=min-dist;
        a.x-=nx*overlap*.5;
        a.y-=ny*overlap*.5;
        b.x+=nx*overlap*.5;
        b.y+=ny*overlap*.5;

        const rvx=b.vx-a.vx;
        const rvy=b.vy-a.vy;
        const rel=rvx*nx+rvy*ny;

        if(rel<0){
          const restitution=.96;
          const impulse=-(1+restitution)*rel/2;

          a.vx-=impulse*nx;
          a.vy-=impulse*ny;
          b.vx+=impulse*nx;
          b.vy+=impulse*ny;

          ballSound(Math.abs(rel));
        }
      }
    }
  }

  ballsMoving=moving;
}

/* =========================================================
   SOURIS
   ========================================================= */
function pointerPos(e){
  const r=canvas.getBoundingClientRect();
  return{
    x:(e.clientX-r.left)*W/r.width,
    y:(e.clientY-r.top)*H/r.height
  };
}

canvas.addEventListener("pointermove",e=>{
  const p=pointerPos(e);
  const c=cueBall();

  if(!charging&&!ballsMoving){
    aimAngle=Math.atan2(p.y-c.y,p.x-c.x);
  }

  if(charging){
    /*
      projection de la souris vers l'arrière de la queue :
      la direction reste verrouillée pendant le tir.
    */
    const bx=-Math.cos(aimAngle);
    const by=-Math.sin(aimAngle);

    const vx=p.x-c.x;
    const vy=p.y-c.y;

    const projected=vx*bx+vy*by;

    pull=Math.max(0,Math.min(150,projected-BALL_R));
    powerFill.style.width=(pull/150*100)+"%";
  }
});

canvas.addEventListener("pointerdown",e=>{
  if(ballsMoving)return;

  initAudio();

  const p=pointerPos(e);
  const c=cueBall();

  aimAngle=Math.atan2(p.y-c.y,p.x-c.x);

  charging=true;
  pull=0;
  powerFill.style.width="0%";

  canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener("pointerup",e=>{
  if(!charging)return;

  charging=false;

  if(pull>5){
    const power=240+pull*5.2;
    const c=cueBall();

    c.vx=Math.cos(aimAngle)*power;
    c.vy=Math.sin(aimAngle)*power;

    cueSound(pull);
    ballsMoving=true;
  }

  pull=0;
  powerFill.style.width="0%";

  try{canvas.releasePointerCapture(e.pointerId)}catch(_){}
});

canvas.addEventListener("pointercancel",()=>{
  charging=false;
  pull=0;
  powerFill.style.width="0%";
});

/* =========================================================
   BOUTONS
   ========================================================= */
soundBtn.addEventListener("click",()=>{
  soundOn=!soundOn;
  soundBtn.textContent=soundOn?"🔊 SON":"🔇 SON";
  if(soundOn)initAudio();
});

document.getElementById("restartBtn").addEventListener("click",()=>{
  resetGame();
});

/* =========================================================
   RENDU
   ========================================================= */
function render(){
  drawTable();

  for(const b of balls)b.draw();

  drawAim();
  drawCue();
}

function loop(now){
  let frame=(now-lastTime)/1000;
  lastTime=now;

  if(frame>.05)frame=.05;

  accumulator+=frame;

  while(accumulator>=STEP){
    physics(STEP);
    accumulator-=STEP;
  }

  render();
  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
</script>
