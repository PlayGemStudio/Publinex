.floor{

<script>
"use strict";

const canvas=document.getElementById("pool");
const ctx=canvas.getContext("2d");

const powerFill=document.getElementById("powerFill");
const instruction=document.getElementById("instruction");

const W=1100;
const H=550;

const R=19;

/*
  Zone jouable.
  Les poches sont intégrées aux rails :
  elles ne sont plus dessinées comme
  six gros disques posés sur le tapis.
*/
const T={
  left:62,
  right:1038,
  top:55,
  bottom:495
};

const POCKET=28;

let balls=[];
let aimAngle=0;
let lockedAngle=0;

let charging=false;
let dragStart={x:0,y:0};
let pull=0;
const MAX_PULL=145;

let moving=false;
let scratch=false;

let accumulator=0;
let lastTime=performance.now();
const STEP=1/120;

/* =========================
   AUDIO
========================= */

let ac=null;
let master=null;
let musicBus=null;
let fxBus=null;

let musicOn=true;
let soundOn=true;
let musicStarted=false;

let scheduler=null;
let musicStep=0;

function ensureAudio(){
  if(!ac){
    ac=new (window.AudioContext||window.webkitAudioContext)();

    master=ac.createGain();
    musicBus=ac.createGain();
    fxBus=ac.createGain();

    master.gain.value=.96;
    musicBus.gain.value=.72;
    fxBus.gain.value=.90;

    musicBus.connect(master);
    fxBus.connect(master);
    master.connect(ac.destination);
  }

  if(ac.state==="suspended")ac.resume();

  if(musicOn&&!musicStarted)startMusic();
}

function tone(freq,duration,volume,type,bus,delay=0,endFreq=null){
  if(!ac)return;

  const t=ac.currentTime+delay;
  const o=ac.createOscillator();
  const g=ac.createGain();

  o.type=type||"sine";
  o.frequency.setValueAtTime(freq,t);

  if(endFreq){
    o.frequency.exponentialRampToValueAtTime(
      Math.max(25,endFreq),
      t+duration
    );
  }

  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(volume,t+.018);
  g.gain.exponentialRampToValueAtTime(.0001,t+duration);

  o.connect(g);
  g.connect(bus);

  o.start(t);
  o.stop(t+duration+.05);
}

function noise(duration,volume,cutoff,bus=fxBus){
  if(!ac)return;

  const length=Math.floor(ac.sampleRate*duration);
  const buffer=ac.createBuffer(1,length,ac.sampleRate);
  const data=buffer.getChannelData(0);

  for(let i=0;i<length;i++){
    data[i]=(Math.random()*2-1)*(1-i/length);
  }

  const src=ac.createBufferSource();
  const filter=ac.createBiquadFilter();
  const gain=ac.createGain();

  src.buffer=buffer;
  filter.type="lowpass";
  filter.frequency.value=cutoff;
  gain.gain.value=volume;

  src.connect(filter);
  filter.connect(gain);
  gain.connect(bus);
  src.start();
}

/*
  Musique lounge originale.
  Plus présente que les versions précédentes.
*/

const bass=[
  55,55,65.41,73.42,
  49,55,65.41,73.42,
  55,65.41,73.42,82.41,
  49,55,65.41,55
];

const chords=[
  [220,261.63,329.63],
  [196,246.94,293.66],
  [174.61,220,261.63],
  [196,246.94,293.66]
];

function musicBeat(){
  if(!ac||!musicOn)return;

  const s=musicStep%16;

  tone(
    bass[s],
    .40,
    .14,
    "triangle",
    musicBus
  );

  if(s%4===0){
    const chord=chords[(s/4)%4];

    chord.forEach((f,i)=>{
      tone(f,.85,.042,"sine",musicBus,i*.012);
      tone(f*2,.50,.014,"triangle",musicBus,i*.012);
    });
  }

  if(s%4===0){
    tone(90,.12,.15,"sine",musicBus,0,42);
  }

  if(s%2===1){
    noise(.035,.022,5000,musicBus);
  }

  if(s===6||s===14){
    tone(440,.16,.025,"triangle",musicBus);
    tone(659.25,.14,.018,"sine",musicBus,.04);
  }

  musicStep++;
}

function startMusic(){
  if(musicStarted)return;

  musicStarted=true;
  musicBeat();
  scheduler=setInterval(musicBeat,390);
}

function stopMusic(){
  clearInterval(scheduler);
  scheduler=null;
  musicStarted=false;
}

function cueSound(power){
  if(!soundOn)return;

  tone(250,.045,.58,"triangle",fxBus,0,120);
  tone(92,.08,.42,"sine",fxBus);
  noise(.035,.16,1800);
}

let lastCollision=0;

function collisionSound(impact){
  if(!soundOn)return;

  const now=performance.now();
  if(now-lastCollision<14)return;
  lastCollision=now;

  const v=Math.min(.58,.14+impact*.016);

  tone(390,.04,v,"triangle",fxBus,0,220);
  tone(180,.035,v*.32,"sine",fxBus);
}

function railSound(impact){
  if(!soundOn)return;

  const v=Math.min(.48,.12+impact*.012);

  tone(125,.055,v,"triangle",fxBus,0,72);
  noise(.028,v*.16,800);
}

function pocketSound(){
  if(!soundOn)return;

  tone(170,.16,.62,"sine",fxBus,0,62);
  tone(75,.24,.43,"triangle",fxBus,.02,38);
  noise(.09,.14,500);
}

musicBtn.onclick=()=>{
  ensureAudio();
  musicOn=!musicOn;

  if(musicOn){
    musicBus.gain.value=.72;
    startMusic();
    musicBtn.textContent="♫ MUSIQUE";
  }else{
    musicBus.gain.value=0;
    stopMusic();
    musicBtn.textContent="♫ COUPÉE";
  }
};

soundBtn.onclick=()=>{
  ensureAudio();
  soundOn=!soundOn;

  fxBus.gain.value=soundOn?.9:0;
  soundBtn.textContent=soundOn?"🔊 SON":"🔇 SON";
};

/* =========================
   CANVAS
========================= */

function resize(){
  const rect=canvas.getBoundingClientRect();
  const dpr=Math.min(devicePixelRatio||1,2);

  canvas.width=Math.round(rect.width*dpr);
  canvas.height=Math.round(rect.height*dpr);

  ctx.setTransform(
    canvas.width/W,0,
    0,canvas.height/H,
    0,0
  );
}

addEventListener("resize",resize);

/* =========================
   BILLES
========================= */

const colors={
  1:"#f2ce18",
  2:"#176fd1",
  3:"#dc2835",
  4:"#8238a8",
  5:"#ed7718",
  6:"#168b50",
  7:"#7e2028",
  8:"#111317",
  9:"#f2ce18",
  10:"#176fd1",
  11:"#dc2835",
  12:"#8238a8",
  13:"#ed7718",
  14:"#168b50",
  15:"#7e2028"
};

class Ball{
  constructor(number,x,y){
    this.number=number;
    this.x=x;
    this.y=y;
    this.vx=0;
    this.vy=0;
    this.pocketed=false;
  }

  speed(){
    return Math.hypot(this.vx,this.vy);
  }
}

function whiteBall(){
  return balls[0];
}

function pockets(){
  return[
    {x:T.left,y:T.top,type:"corner"},
    {x:(T.left+T.right)/2,y:T.top,type:"middle"},
    {x:T.right,y:T.top,type:"corner"},
    {x:T.left,y:T.bottom,type:"corner"},
    {x:(T.left+T.right)/2,y:T.bottom,type:"middle"},
    {x:T.right,y:T.bottom,type:"corner"}
  ];
}

function resetGame(){
  balls=[];
  moving=false;
  charging=false;
  scratch=false;
  pull=0;

  balls.push(new Ball(0,735,275));

  const rack=[
    [1],
    [9,2],
    [3,8,10],
    [11,4,12,5],
    [6,13,7,14,15]
  ];

  const startX=350;
  const dx=R*1.79;
  const dy=R*2.06;

  rack.forEach((row,col)=>{
    row.forEach((n,i)=>{
      balls.push(
        new Ball(
          n,
          startX+col*dx,
          275+(i-(row.length-1)/2)*dy
        )
      );
    });
  });

  aimAngle=Math.PI;
  lockedAngle=aimAngle;

  updatePower();
  instruction.textContent="Déplace la souris pour viser";
}

newBtn.onclick=()=>{
  ensureAudio();
  resetGame();
};

/* =========================
   PHYSIQUE
========================= */

function stopped(){
  return balls.every(b=>b.pocketed||b.speed()<.045);
}

function checkPocket(b){
  for(const p of pockets()){
    const d=Math.hypot(b.x-p.x,b.y-p.y);

    if(d<POCKET){
      b.pocketed=true;
      b.vx=0;
      b.vy=0;

      pocketSound();

      if(b.number===0)scratch=true;
      return true;
    }
  }

  return false;
}

function cushions(b){
  let impact=0;

  if(b.x-R<T.left){
    impact=Math.abs(b.vx);
    b.x=T.left+R;
    b.vx=Math.abs(b.vx)*.91;
  }

  if(b.x+R>T.right){
    impact=Math.max(impact,Math.abs(b.vx));
    b.x=T.right-R;
    b.vx=-Math.abs(b.vx)*.91;
  }

  if(b.y-R<T.top){
    impact=Math.max(impact,Math.abs(b.vy));
    b.y=T.top+R;
    b.vy=Math.abs(b.vy)*.91;
  }

  if(b.y+R>T.bottom){
    impact=Math.max(impact,Math.abs(b.vy));
    b.y=T.bottom-R;
    b.vy=-Math.abs(b.vy)*.91;
  }

  if(impact>.8)railSound(impact);
}

function collide(a,b){
  let dx=b.x-a.x;
  let dy=b.y-a.y;
  let distance=Math.hypot(dx,dy);

  if(distance===0){
    distance=.01;
    dx=.01;
  }

  const min=R*2;
  if(distance>=min)return;

  const nx=dx/distance;
  const ny=dy/distance;

  const overlap=min-distance;

  a.x-=nx*overlap*.5;
  a.y-=ny*overlap*.5;
  b.x+=nx*overlap*.5;
  b.y+=ny*overlap*.5;

  const rvx=b.vx-a.vx;
  const rvy=b.vy-a.vy;

  const vn=rvx*nx+rvy*ny;

  if(vn>0)return;

  const restitution=.965;
  const impulse=-(1+restitution)*vn/2;

  a.vx-=impulse*nx;
  a.vy-=impulse*ny;

  b.vx+=impulse*nx;
  b.vy+=impulse*ny;

  if(Math.abs(vn)>.55){
    collisionSound(Math.abs(vn));
  }
}

function physics(dt){
  const scale=dt*120;

  for(const b of balls){
    if(b.pocketed)continue;

    b.x+=b.vx*scale;
    b.y+=b.vy*scale;

    const f=Math.pow(.991,scale);

    b.vx*=f;
    b.vy*=f;

    if(Math.abs(b.vx)<.04)b.vx=0;
    if(Math.abs(b.vy)<.04)b.vy=0;

    if(!checkPocket(b))cushions(b);
  }

  for(let i=0;i<balls.length;i++){
    if(balls[i].pocketed)continue;

    for(let j=i+1;j<balls.length;j++){
      if(!balls[j].pocketed){
        collide(balls[i],balls[j]);
      }
    }
  }

  if(moving&&stopped()){
    moving=false;

    if(scratch){
      const w=whiteBall();

      w.pocketed=false;
      w.x=735;
      w.y=275;
      w.vx=w.vy=0;

      scratch=false;
    }

    instruction.textContent="Déplace la souris pour viser";
  }
}

/* =========================
   SOURIS / QUEUE
========================= */

function pointerPosition(e){
  const rect=canvas.getBoundingClientRect();

  return{
    x:(e.clientX-rect.left)/rect.width*W,
    y:(e.clientY-rect.top)/rect.height*H
  };
}

canvas.addEventListener("pointermove",e=>{
  if(moving||!stopped())return;

  const p=pointerPosition(e);
  const w=whiteBall();

  if(!charging){
    aimAngle=Math.atan2(
      p.y-w.y,
      p.x-w.x
    );
  }else{
    const mx=p.x-dragStart.x;
    const my=p.y-dragStart.y;

    const backX=-Math.cos(lockedAngle);
    const backY=-Math.sin(lockedAngle);

    pull=Math.max(
      0,
      Math.min(
        MAX_PULL,
        mx*backX+my*backY
      )
    );

    updatePower();
  }
});

canvas.addEventListener("pointerdown",e=>{
  ensureAudio();

  if(moving||!stopped())return;

  charging=true;
  lockedAngle=aimAngle;
  dragStart=pointerPosition(e);
  pull=0;

  canvas.setPointerCapture(e.pointerId);

  instruction.textContent="Maintiens et recule la queue";
});

canvas.addEventListener("pointerup",()=>{
  if(!charging)return;

  charging=false;

  if(pull<8){
    pull=0;
    updatePower();
    instruction.textContent="Recule davantage la queue";
    return;
  }

  shoot();
});

function updatePower(){
  const percent=Math.round(pull/MAX_PULL*100);
  powerFill.style.width=percent+"%";
}

function shoot(){
  const w=whiteBall();
  const power=pull/MAX_PULL;
  const speed=7+power*30;

  w.vx=Math.cos(lockedAngle)*speed;
  w.vy=Math.sin(lockedAngle)*speed;

  cueSound(power);

  aimAngle=lockedAngle;

  pull=0;
  updatePower();

  moving=true;
  instruction.textContent="Billes en mouvement…";
}

/* =========================
   TABLE PREMIUM
========================= */

function drawTable(){
  ctx.clearRect(0,0,W,H);

  /*
    Tapis avec texture et profondeur.
  */

  const felt=ctx.createRadialGradient(
    550,220,40,
    550,275,600
  );

  felt.addColorStop(0,"#13a66d");
  felt.addColorStop(.55,"#078a59");
  felt.addColorStop(1,"#035d3d");

  ctx.fillStyle=felt;
  ctx.fillRect(
    T.left,
    T.top,
    T.right-T.left,
    T.bottom-T.top
  );

  /*
    Grain très léger du tapis.
  */

  ctx.save();
  ctx.globalAlpha=.055;

  for(let i=0;i<500;i++){
    const x=T.left+Math.random()*(T.right-T.left);
    const y=T.top+Math.random()*(T.bottom-T.top);

    ctx.fillStyle=i%2?"#fff":"#002f1d";
    ctx.fillRect(x,y,1,1);
  }

  ctx.restore();

  /*
    BANDES DROITES.
  */

  const rail="#07583c";
  const railLight="#0d8a5d";

  ctx.fillStyle=rail;

  ctx.fillRect(
    T.left+POCKET,
    T.top-17,
    (T.right-T.left)/2-POCKET*2,
    17
  );

  ctx.fillRect(
    (T.left+T.right)/2+POCKET,
    T.top-17,
    (T.right-T.left)/2-POCKET*2,
    17
  );

  ctx.fillRect(
    T.left+POCKET,
    T.bottom,
    (T.right-T.left)/2-POCKET*2,
    17
  );

  ctx.fillRect(
    (T.left+T.right)/2+POCKET,
    T.bottom,
    (T.right-T.left)/2-POCKET*2,
    17
  );

  ctx.fillRect(
    T.left-17,
    T.top+POCKET,
    17,
    T.bottom-T.top-POCKET*2
  );

  ctx.fillRect(
    T.right,
    T.top+POCKET,
    17,
    T.bottom-T.top-POCKET*2
  );

  /*
    reflet sur les bandes
  */

  ctx.fillStyle=railLight;

  ctx.fillRect(
    T.left+35,
    T.top-5,
    T.right-T.left-70,
    5
  );

  ctx.fillStyle="rgba(0,0,0,.22)";

  ctx.fillRect(
    T.left+35,
    T.bottom,
    T.right-T.left-70,
    6
  );

  /*
    Poches intégrées :
    ouverture + lèvre métallique,
    sans gros disque flottant.
  */

  for(const p of pockets()){
    drawPocket(p);
  }

  /*
    Repères du cadre intérieur.
  */

  ctx.fillStyle="#d8c6a3";

  for(let i=1;i<8;i++){
    const x=T.left+(T.right-T.left)*i/8;

    if(Math.abs(x-(T.left+T.right)/2)>45){
      diamond(x,T.top-28);
      diamond(x,T.bottom+28);
    }
  }
}

function drawPocket(p){
  ctx.save();

  /*
    Ombre de cavité.
  */

  ctx.shadowColor="#000";
  ctx.shadowBlur=12;

  const g=ctx.createRadialGradient(
    p.x-5,p.y-5,3,
    p.x,p.y,POCKET+5
  );

  g.addColorStop(0,"#000");
  g.addColorStop(.72,"#010101");
  g.addColorStop(.86,"#3c2819");
  g.addColorStop(1,"#bd8b56");

  ctx.beginPath();
  ctx.arc(
    p.x,p.y,
    POCKET,
    0,Math.PI*2
  );

  ctx.fillStyle=g;
  ctx.fill();

  /*
    Le tapis recouvre une partie de la poche,
    donnant l'impression qu'elle est découpée
    dans le rail.
  */

  ctx.shadowColor="transparent";
  ctx.strokeStyle="rgba(225,177,112,.65)";
  ctx.lineWidth=3;

  ctx.beginPath();
  ctx.arc(
    p.x,p.y,
    POCKET-1,
    0,Math.PI*2
  );
  ctx.stroke();

  ctx.restore();
}

function diamond(x,y){
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(Math.PI/4);
  ctx.fillRect(-3,-3,6,6);
  ctx.restore();
}

/* =========================
   BILLES
========================= */

function drawBall(b){
  if(b.pocketed)return;

  ctx.save();

  ctx.shadowColor="rgba(0,0,0,.7)";
  ctx.shadowBlur=10;
  ctx.shadowOffsetX=5;
  ctx.shadowOffsetY=7;

  const base=b.number===0?"#f5f5f0":colors[b.number];

  const g=ctx.createRadialGradient(
    b.x-R*.48,
    b.y-R*.52,
    1,
    b.x,
    b.y,
    R*1.2
  );

  g.addColorStop(0,"#fff");
  g.addColorStop(.17,base);
  g.addColorStop(.68,base);
  g.addColorStop(1,"#030405");

  ctx.beginPath();
  ctx.arc(b.x,b.y,R,0,Math.PI*2);
  ctx.fillStyle=g;
  ctx.fill();

  ctx.shadowColor="transparent";

  if(b.number>=9){
    ctx.save();

    ctx.beginPath();
    ctx.arc(b.x,b.y,R-.8,0,Math.PI*2);
    ctx.clip();

    ctx.fillStyle="#f7f4e9";
    ctx.fillRect(
      b.x-R,
      b.y-7.5,
      R*2,
      15
    );

    ctx.restore();
  }

  if(b.number!==0){
    ctx.beginPath();
    ctx.arc(b.x,b.y,8.8,0,Math.PI*2);
    ctx.fillStyle="#faf8ef";
    ctx.fill();

    ctx.fillStyle="#111";
    ctx.font="bold 10px Arial";
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillText(b.number,b.x,b.y+.3);
  }

  /*
    Reflet fort type bille vernie.
  */

  ctx.beginPath();
  ctx.ellipse(
    b.x-R*.38,
    b.y-R*.48,
    R*.30,
    R*.15,
    -.55,
    0,
    Math.PI*2
  );

  ctx.fillStyle="rgba(255,255,255,.78)";
  ctx.fill();

  ctx.restore();
}

/* =========================
   GUIDE DE VISÉE VALIDÉ
========================= */

function calculateAim(){
  const w=whiteBall();

  const angle=charging?lockedAngle:aimAngle;
  const dx=Math.cos(angle);
  const dy=Math.sin(angle);

  let target=null;
  let nearest=Infinity;

  for(const b of balls){
    if(b===w||b.pocketed)continue;

    const ox=b.x-w.x;
    const oy=b.y-w.y;

    const projection=ox*dx+oy*dy;

    if(projection<=0)continue;

    const perpendicularSq=
      ox*ox+oy*oy-projection*projection;

    const radius=R*2;

    if(perpendicularSq>radius*radius)continue;

    const offset=Math.sqrt(
      radius*radius-perpendicularSq
    );

    const distance=projection-offset;

    if(distance>0&&distance<nearest){
      nearest=distance;
      target=b;
    }
  }

  if(target){
    return{
      target,
      x:w.x+dx*nearest,
      y:w.y+dy*nearest,
      dx,dy
    };
  }

  let d=Infinity;

  if(dx>0)d=Math.min(d,(T.right-R-w.x)/dx);
  if(dx<0)d=Math.min(d,(T.left+R-w.x)/dx);
  if(dy>0)d=Math.min(d,(T.bottom-R-w.y)/dy);
  if(dy<0)d=Math.min(d,(T.top+R-w.y)/dy);

  return{
    target:null,
    x:w.x+dx*d,
    y:w.y+dy*d,
    dx,dy
  };
}

function drawGuide(){
  if(moving||!stopped())return;

  const w=whiteBall();
  if(w.pocketed)return;

  const a=calculateAim();

  ctx.save();

  /*
    Ligne principale.
  */

  ctx.strokeStyle="rgba(255,255,255,.92)";
  ctx.lineWidth=2;

  ctx.beginPath();
  ctx.moveTo(w.x,w.y);
  ctx.lineTo(a.x,a.y);
  ctx.stroke();

  /*
    Cercle fantôme.
  */

  ctx.beginPath();
  ctx.arc(a.x,a.y,R,0,Math.PI*2);

  ctx.strokeStyle="#fff";
  ctx.lineWidth=2.5;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(a.x,a.y,3,0,Math.PI*2);
  ctx.fillStyle="#fff";
  ctx.fill();

  /*
    Trajectoire de la bille touchée.
  */

  if(a.target){
    let tx=a.target.x-a.x;
    let ty=a.target.y-a.y;

    const len=Math.hypot(tx,ty);

    if(len){
      tx/=len;
      ty/=len;

      const prediction=105;

      ctx.beginPath();
      ctx.moveTo(a.target.x,a.target.y);
      ctx.lineTo(
        a.target.x+tx*prediction,
        a.target.y+ty*prediction
      );

      ctx.strokeStyle="rgba(255,255,255,.88)";
      ctx.lineWidth=2;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(
        a.target.x+tx*prediction,
        a.target.y+ty*prediction,
        3.5,
        0,Math.PI*2
      );

      ctx.fillStyle="#fff";
      ctx.fill();
    }
  }

  ctx.restore();
}

/* =========================
   QUEUE
========================= */

function drawCue(){
  if(moving||!stopped())return;

  const w=whiteBall();
  if(w.pocketed)return;

  const angle=charging?lockedAngle:aimAngle;

  const dx=Math.cos(angle);
  const dy=Math.sin(angle);

  const gap=R+10+pull;
  const length=390;

  const tipX=w.x-dx*gap;
  const tipY=w.y-dy*gap;

  const backX=w.x-dx*(gap+length);
  const backY=w.y-dy*(gap+length);

  ctx.save();
  ctx.lineCap="round";

  /*
    Ombre de la queue.
  */

  ctx.strokeStyle="rgba(0,0,0,.55)";
  ctx.lineWidth=12;

  ctx.beginPath();
  ctx.moveTo(tipX+4,tipY+5);
  ctx.lineTo(backX+4,backY+5);
  ctx.stroke();

  /*
    Bois.
  */

  const wood=ctx.createLinearGradient(
    tipX,tipY,
    backX,backY
  );

  wood.addColorStop(0,"#f4dfb2");
  wood.addColorStop(.28,"#d7a05e");
  wood.addColorStop(.62,"#9a4c22");
  wood.addColorStop(.82,"#4b1d0d");
  wood.addColorStop(1,"#190806");

  ctx.strokeStyle=wood;
  ctx.lineWidth=9;

  ctx.beginPath();
  ctx.moveTo(tipX,tipY);
  ctx.lineTo(backX,backY);
  ctx.stroke();

  /*
    Virole claire.
  */

  ctx.strokeStyle="#efe6ce";
  ctx.lineWidth=7;

  ctx.beginPath();
  ctx.moveTo(tipX,tipY);
  ctx.lineTo(
    tipX-dx*16,
    tipY-dy*16
  );
  ctx.stroke();

  /*
    Procédé bleu.
  */

  ctx.strokeStyle="#26baff";
  ctx.lineWidth=6;

  ctx.beginPath();
  ctx.moveTo(tipX,tipY);
  ctx.lineTo(
    tipX-dx*6,
    tipY-dy*6
  );
  ctx.stroke();

  /*
    Décoration arrière.
  */

  ctx.strokeStyle="#d2a14e";
  ctx.lineWidth=10;

  ctx.beginPath();
  ctx.moveTo(
    backX+dx*50,
    backY+dy*50
  );
  ctx.lineTo(
    backX+dx*78,
    backY+dy*78
  );
  ctx.stroke();

  ctx.restore();
}

/* =========================
   RENDU
========================= */

function render(){
  drawTable();
  drawGuide();

  for(const b of balls){
    drawBall(b);
  }

  drawCue();
}

/* =========================
   BOUCLE
========================= */

function loop(now){
  const delta=Math.min(
    .03,
    (now-lastTime)/1000
  );

  lastTime=now;
  accumulator+=delta;

  while(accumulator>=STEP){
    physics(STEP);
    accumulator-=STEP;
  }

  render();
  requestAnimationFrame(loop);
}

resize();
resetGame();
requestAnimationFrame(loop);

/*
  Démarrage audio après la première interaction,
  obligatoire dans les navigateurs modernes.
*/

document.addEventListener(
  "pointerdown",
  ensureAudio,
  {once:true}
);

</script>
</body>
</html>
